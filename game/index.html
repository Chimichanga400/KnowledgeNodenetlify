<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#0b1f16"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<title>Emerald Estates — An Underground Empire</title>
<style>
  :root{
    --bg:#0b1410; --panel:#122419; --panel2:#0e1c14; --line:#21402f;
    --gold:#d9b45b; --gold-hi:#f2d489; --gold-dim:#8f7a45; --green:#5fbf7f; --red:#e2635f;
    --ink:#e8e4d8; --ink-dim:#9aa89d; --blue:#6fa8dc;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.45; overscroll-behavior:none;}
  body{background:
    radial-gradient(1200px 600px at 50% -100px, #14291c 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 100%, #0d1f15 0%, transparent 55%),
    var(--bg);
    min-height:100vh;}
  body::after{content:''; position:fixed; inset:0; pointer-events:none; z-index:5;
    box-shadow:inset 0 0 140px rgba(0,0,0,.55);}
  h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;}
  button{font:inherit; cursor:pointer; border:none; border-radius:10px;
    background:var(--panel); color:var(--ink); padding:9px 14px;
    transition:transform .06s ease, box-shadow .15s;}
  button:active{transform:scale(.955);}
  button:disabled{opacity:.4; cursor:default;}
  button.gold{background:linear-gradient(180deg,var(--gold-hi),#a8843a); color:#241a05; font-weight:700;
    box-shadow:0 1px 0 #fff3 inset, 0 2px 6px rgba(0,0,0,.4);}
  button.gold:not(:disabled):hover{box-shadow:0 1px 0 #fff5 inset, 0 0 14px rgba(217,180,91,.35);}
  button.ghost{background:transparent; border:1px solid var(--line); color:var(--ink-dim);}
  button.danger{background:#3a1715; color:#f0b0ae; border:1px solid #5c2523;}

  #wrap{max-width:900px; margin:0 auto; padding:0 10px calc(84px + env(safe-area-inset-bottom)); position:relative; z-index:1;}
  @media(min-width:700px){ #wrap{padding-bottom:20px;} }

  /* ── HUD ── */
  #hud{position:sticky; top:0; z-index:40; background:linear-gradient(180deg,#0d1a13 88%,rgba(13,26,19,0));
    padding:10px 4px 10px;}
  #hud .row1{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  #hud h1{font-size:19px; margin:0; color:var(--gold); letter-spacing:.5px; white-space:nowrap;
    text-shadow:0 0 18px rgba(217,180,91,.35);}
  #clock{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink-dim); font-size:13.5px; white-space:nowrap;}
  #hud .row2{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center;}
  .stat{background:linear-gradient(180deg,#132a1c,#0e1c14); border:1px solid var(--line); border-radius:10px;
    padding:5px 10px; font-size:13px; display:flex; gap:6px; align-items:center; white-space:nowrap;
    box-shadow:0 1px 0 #ffffff0d inset;}
  .stat b{font-variant-numeric:tabular-nums;}
  .stat .lbl{color:var(--ink-dim); font-size:11px; text-transform:uppercase; letter-spacing:.6px;}
  #heatwrap{flex:1; min-width:110px;}
  #heatwrap.hot{border-color:#a34; animation:hotpulse 1.1s infinite;}
  @keyframes hotpulse{0%,100%{box-shadow:0 0 0 rgba(226,99,95,0);}50%{box-shadow:0 0 16px rgba(226,99,95,.55);}}
  #heatbar{height:8px; border-radius:6px; background:#20140f; overflow:hidden; margin-top:3px;}
  #heatfill{height:100%; width:0%; background:linear-gradient(90deg,#c98a3a,#e2635f); transition:width .4s;}
  #speed{display:flex; gap:4px;}
  #speed button{padding:5px 10px; font-size:12px; border:1px solid var(--line); background:var(--panel2); color:var(--ink-dim);}
  #speed button.on{color:#1d1405; background:var(--gold); font-weight:700;}

  /* ── Scenery ── */
  #scenewrap{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin:2px 0 4px;
    box-shadow:0 6px 24px rgba(0,0,0,.45), 0 1px 0 #ffffff12 inset; position:relative;}
  #scene{display:block; width:100%; height:auto;}
  #phase{position:absolute; right:9px; top:7px; background:rgba(6,12,9,.55); border:1px solid #ffffff22;
    border-radius:20px; padding:2px 10px; font-size:11.5px; color:#f2ecd9; backdrop-filter:blur(3px);}
  .cloud{animation:drift linear infinite;}
  .c1{animation-duration:95s;} .c2{animation-duration:140s; animation-delay:-60s;} .c3{animation-duration:170s; animation-delay:-120s;}
  @keyframes drift{from{transform:translateX(-180px);} to{transform:translateX(960px);}}
  #smoke path{animation:puff 5s infinite ease-in-out; opacity:.5;}
  @keyframes puff{0%,100%{opacity:.25;}50%{opacity:.6;}}
  #police{opacity:0; transition:opacity .8s;}
  #scenewrap.hot #police{opacity:1;}
  #pl1{animation:blinkr 0.7s infinite;} #pl2{animation:blinkb 0.7s infinite; animation-delay:.35s;}
  @keyframes blinkr{0%,49%{fill:#ff5148;}50%,100%{fill:#5a1512;}}
  @keyframes blinkb{0%,49%{fill:#57a0ff;}50%,100%{fill:#12275a;}}
  .winw{fill:#16281d; transition:fill 1.5s;}
  #scenewrap.night .winw{fill:#ffd75e;}
  #scenewrap.night .ghg{fill:#c6e6b8; opacity:.35;}

  /* ── Tabs ── */
  #tabs{position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex;
    background:linear-gradient(180deg,#0c1710,#081009); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -6px 20px rgba(0,0,0,.5);}
  #tabs button{flex:1; background:none; border-radius:0; padding:9px 2px 8px; color:var(--ink-dim);
    font-size:11px; display:flex; flex-direction:column; align-items:center; gap:2px;}
  #tabs button .ico{font-size:19px; line-height:1; filter:grayscale(.7) brightness(.8); transition:filter .2s;}
  #tabs button.on{color:var(--gold);}
  #tabs button.on .ico{filter:none; text-shadow:0 0 14px rgba(217,180,91,.6);}
  #tabs button .bdg{position:absolute; transform:translate(14px,-4px); background:var(--red); color:#fff;
    border-radius:9px; font-size:10px; min-width:16px; padding:1px 4px; font-weight:700;}
  @media(min-width:700px){
    #tabs{position:sticky; top:0; bottom:auto; border-top:none; border-bottom:1px solid var(--line);
      max-width:900px; margin:0 auto; background:transparent; box-shadow:none;}
    #tabs button{font-size:13px; flex-direction:row; gap:7px; padding:11px;}
  }

  /* ── Cards ── */
  .card{background:linear-gradient(180deg,#132619,#101f15); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 14px; margin:10px 0; box-shadow:0 3px 14px rgba(0,0,0,.3), 0 1px 0 #ffffff0a inset;}
  .card h3{margin:0 0 4px; font-size:16px; color:var(--gold);}
  .card .sub{color:var(--ink-dim); font-size:12.5px;}
  .rowline{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .spacer{flex:1;}
  .money{color:var(--green); font-variant-numeric:tabular-nums;}
  .dirty{color:#d9b45b;} .bad{color:var(--red);} .muted{color:var(--ink-dim);}
  .pill{display:inline-block; background:var(--panel2); border:1px solid var(--line);
    border-radius:20px; padding:2px 9px; font-size:11.5px; color:var(--ink-dim); margin:2px 3px 2px 0;}
  .up{color:var(--green);} .down{color:var(--red);}

  /* ── Estate art banner ── */
  .estArt{height:64px; border-radius:10px 10px 0 0; margin:-13px -14px 10px; overflow:hidden; position:relative;
    background:linear-gradient(180deg,#33507a 0%, #7c6a52 78%, #1b3323 78%, #12281a 100%);
    border-bottom:1px solid var(--line);}
  .estArt.locked{filter:grayscale(.85) brightness(.55);}
  .estArt svg{position:absolute; bottom:0; left:0; width:100%; height:100%;}
  .estArt .sil{fill:#0a1a11;}
  .estArt .ew{fill:#ffd75e;}

  /* ── Residence hero (Grow tab: your current house) ── */
  .residence{padding:0 !important; overflow:hidden; position:relative;}
  .residence svg{display:block; width:100%;}
  .hsil{fill:#1a2c20;} .hsil .ew{fill:#f2d489;}
  .residence .cap{position:absolute; left:13px; bottom:9px; text-shadow:0 1px 5px #000;}
  .residence .cap .k{font-size:10.5px; letter-spacing:.6px; text-transform:uppercase; color:#cfd8cf; opacity:.85;}
  .residence .cap .n{font-family:Georgia,serif; font-size:18px; color:var(--gold);}
  .residence .pills{position:absolute; right:11px; top:10px; text-align:right;}

  /* ── Plots ── */
  .plots{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; margin-top:10px;}
  .plot{background:linear-gradient(180deg,#0f2015 55%,#221a10); border:1px solid var(--line); border-radius:12px;
    min-height:118px; padding:6px 4px 8px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    text-align:center; cursor:pointer; user-select:none; position:relative; overflow:hidden;}
  .plot:hover{border-color:var(--gold-dim);}
  .plot .plantsvg{width:52px; height:52px;}
  .plot .nm{font-size:10.5px; color:var(--ink-dim); margin-top:1px; line-height:1.2;}
  .plot.ready{border-color:var(--gold); box-shadow:0 0 14px rgba(217,180,91,.3), 0 0 4px rgba(217,180,91,.4) inset;}
  .plot.ready .plantsvg{animation:sway 2s infinite ease-in-out;}
  @keyframes sway{0%,100%{transform:rotate(-2.5deg);}50%{transform:rotate(2.5deg);}}
  .plot.dry{border-color:#8a5a2b;}
  .plot .plus{font-size:24px; color:var(--ink-dim); margin:14px 0;}
  .bar{width:82%; height:5px; background:#0a0f0c; border-radius:4px; overflow:hidden; margin-top:5px;}
  .bar i{display:block; height:100%; background:var(--green);}
  .bar.w i{background:var(--blue);}
  .sparkle{animation:spk 1.2s infinite;}
  @keyframes spk{0%,100%{opacity:.4;}50%{opacity:1;}}

  /* ── Offers / contracts ── */
  .offer{border-left:3px solid var(--gold);}
  .contract{border-left:3px solid var(--blue);}
  .offer .price{font-size:17px;}
  .offbtns{display:flex; gap:8px; margin-top:9px;}
  .offbtns button{flex:1;}

  /* ── Modal ── */
  #modalback{position:fixed; inset:0; background:rgba(4,8,6,.8); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:18px; backdrop-filter:blur(2px);}
  #modal{background:linear-gradient(180deg,#152a1c,#101f15); border:1px solid var(--gold-dim); border-radius:16px;
    max-width:480px; width:100%; max-height:82vh; overflow-y:auto; padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.7), 0 0 40px rgba(217,180,91,.08); animation:mIn .22s ease-out;}
  @keyframes mIn{from{opacity:0; transform:translateY(14px) scale(.97);} to{opacity:1;}}
  #modal h2{margin:0 0 8px; color:var(--gold); font-size:20px;}
  #modal .choices{display:flex; flex-direction:column; gap:9px; margin-top:14px;}
  #modal .choices button{text-align:left; padding:12px 14px; background:var(--panel2);
    border:1px solid var(--line); line-height:1.35;}
  #modal .choices button:hover{border-color:var(--gold-dim);}
  #modal .choices button small{display:block; color:var(--ink-dim); font-size:12px; margin-top:2px;}
  .hidden{display:none !important;}

  /* ── Toasts & FX ── */
  #toasts{position:fixed; top:8px; left:50%; transform:translateX(-50%); z-index:200;
    display:flex; flex-direction:column; gap:6px; width:min(94vw,420px); pointer-events:none;}
  .toast{background:#182e22; border:1px solid var(--line); border-left:3px solid var(--gold);
    border-radius:10px; padding:9px 13px; font-size:13.5px; box-shadow:0 4px 18px rgba(0,0,0,.45);
    animation:tin .25s ease-out;}
  .toast.bad{border-left-color:var(--red); background:#2c1614;}
  @keyframes tin{from{opacity:0; transform:translateY(-8px);} to{opacity:1;}}
  .fxf{position:fixed; z-index:300; pointer-events:none; font-weight:800; font-size:17px;
    text-shadow:0 2px 6px rgba(0,0,0,.7); animation:fxup 1.15s ease-out forwards;}
  @keyframes fxup{from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(-72px);}}
  .fxb{position:fixed; z-index:300; pointer-events:none; font-size:19px; animation:fxb .9s ease-out forwards;}
  @keyframes fxb{from{opacity:1; transform:translate(0,0) scale(1);} to{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.6);}}
  body.shake{animation:shake .5s;}
  @keyframes shake{0%,100%{transform:translateX(0);}15%{transform:translateX(-7px);}30%{transform:translateX(6px);}45%{transform:translateX(-5px);}60%{transform:translateX(4px);}75%{transform:translateX(-2px);}}

  .loglist{font-size:13px;}
  .loglist div{padding:6px 2px; border-bottom:1px solid var(--line); color:var(--ink-dim);}
  .loglist b{color:var(--ink);}
  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;}
  .statgrid .card{margin:0; text-align:center;}
  .statgrid .big{font-size:20px; font-weight:700; color:var(--gold);}
  .achgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .ach{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:12px;}
  .ach.got{border-color:var(--gold-dim); background:linear-gradient(180deg,#1c2f1c,#14251a);}
  .ach .em{font-size:19px;}
  .ach.no{opacity:.45; filter:grayscale(1);}
  .invrow{display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px solid var(--line);}
  .hirebtn{white-space:nowrap;}

  /* ── Title screen ── */
  #title{position:fixed; inset:0; z-index:400; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1000px 700px at 50% 15%, #14351f, #060b08 72%);}
  #title::after{content:''; position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 180px rgba(0,0,0,.7);}
  #title .tbox{text-align:center; padding:30px; max-width:400px; width:100%; position:relative; z-index:1;}
  #title .tlogo{font-size:62px; animation:tfloat 3.5s ease-in-out infinite;}
  @keyframes tfloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  #title h1{font-size:40px; color:var(--gold); margin:6px 0 2px; text-shadow:0 0 32px rgba(217,180,91,.45);}
  #title .tag{color:var(--ink-dim); margin:4px 0 24px; letter-spacing:3px; text-transform:uppercase; font-size:11.5px;}
  #title button{display:block; width:100%; margin:9px 0; padding:13px; font-size:16px;}
  #title .tiny{font-size:10.5px; color:var(--ink-dim); margin-top:18px;}

  /* ── Tab-switch animation ── */
  #view.anim .card{animation:cardIn .3s both;}
  @keyframes cardIn{from{opacity:0; transform:translateY(10px);} to{opacity:1;}}

  /* ── Life tab ── */
  .bar.love i{background:#e26fa0;}
  .bar.trust i{background:var(--gold);}
  .lbar{width:100%; height:8px; margin:7px 0 3px;}
  .heart{color:#e26fa0;}

  /* ── Skill minigame ── */
  .mini-track{position:relative; height:40px; border-radius:12px; overflow:hidden;
    margin:16px 0 4px; border:1px solid var(--line); background:#0a130d;}
  .mini-zone{position:absolute; top:0; bottom:0; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:#0000;}
  .mini-marker{position:absolute; top:-4px; bottom:-4px; width:5px; left:0; border-radius:4px;
    background:#fff; box-shadow:0 0 12px #fff, 0 0 5px #fff; z-index:2;}
  .mini-tip{font-size:11.5px; color:var(--ink-dim); text-align:center; margin-top:2px;}
  #mbtn{width:100%; padding:15px; font-size:17px;}

  /* ── Isometric stage (Street = city, Crew = house) ── */
  #cityStage{margin:6px 0 2px;}
  #sceneCanvas{width:100%; height:auto; display:block; border-radius:var(--radius);
    border:1px solid var(--line); background:#0c1a12;
    box-shadow:0 6px 24px rgba(0,0,0,.45), 0 1px 0 #ffffff12 inset; touch-action:manipulation;}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="row1">
      <h1>🌿 Emerald Estates</h1>
      <span id="clock"></span>
    </div>
    <div class="row2">
      <span class="stat" title="Dirty cash — street money"><span class="lbl">Cash</span> <b class="dirty" id="hCash"></b></span>
      <span class="stat" title="Clean money — laundered, spendable on estates"><span class="lbl">Bank</span> <b class="money" id="hBank"></b></span>
      <span class="stat"><span class="lbl">Rep</span> <b id="hRep"></b></span>
      <span class="stat" id="heatwrap"><span class="lbl">Heat</span> <b id="hHeat"></b>
        <span style="flex:1"><span id="heatbar"><i id="heatfill" style="display:block"></i></span></span>
      </span>
      <span id="speed">
        <button id="sp0" onclick="A.speed(0)">⏸</button>
        <button id="sp1" onclick="A.speed(1)">1×</button>
        <button id="sp2" onclick="A.speed(2)">2×</button>
        <button id="sp3" onclick="A.speed(3)">4×</button>
        <button onclick="A.sleep()" title="Lie low until 6:00 dawn">🌙 Dawn</button>
      </span>
    </div>
  </div>

  <!-- ── Living scenery ── -->
  <div id="scenewrap">
    <svg id="scene" viewBox="0 0 800 190" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
          <stop id="skyTop" offset="0" stop-color="#4a7bb5"/>
          <stop id="skyBot" offset="1" stop-color="#a8cbe8"/>
        </linearGradient>
      </defs>
      <rect width="800" height="190" fill="url(#skyG)"/>
      <g id="stars" opacity="0" fill="#f5f0dd">
        <circle cx="60" cy="26" r="1.3"/><circle cx="150" cy="52" r="1"/><circle cx="240" cy="20" r="1.4"/>
        <circle cx="330" cy="44" r="1"/><circle cx="420" cy="16" r="1.2"/><circle cx="500" cy="58" r="1"/>
        <circle cx="590" cy="30" r="1.4"/><circle cx="680" cy="50" r="1"/><circle cx="740" cy="22" r="1.2"/>
        <circle cx="110" cy="80" r="1"/><circle cx="380" cy="74" r="1.1"/><circle cx="640" cy="82" r="1"/>
      </g>
      <circle id="sun" cx="-40" cy="200" r="17" fill="#ffd75e"/>
      <circle id="sunGlow" cx="-40" cy="200" r="30" fill="#ffd75e" opacity="0.18"/>
      <g id="moonG" opacity="0">
        <circle id="moon" cx="-40" cy="200" r="12" fill="#e9e7d4"/>
        <circle id="moonC" cx="-44" cy="196" r="10" fill="#8fa3b8" opacity=".35"/>
      </g>
      <g id="clouds" fill="#ffffff" opacity=".8">
        <g class="cloud c1"><ellipse cx="80" cy="42" rx="34" ry="11"/><ellipse cx="108" cy="36" rx="24" ry="9"/></g>
        <g class="cloud c2"><ellipse cx="300" cy="66" rx="42" ry="12"/><ellipse cx="336" cy="59" rx="26" ry="9"/></g>
        <g class="cloud c3"><ellipse cx="30" cy="24" rx="28" ry="9"/></g>
      </g>
      <!-- hills -->
      <path d="M0 148 Q 120 108 260 136 T 520 130 T 800 142 V190 H0 Z" fill="#163824"/>
      <path d="M0 162 Q 200 132 430 156 T 800 158 V190 H0 Z" fill="#0f2a1a"/>
      <!-- trees -->
      <g fill="#0c2416">
        <circle cx="90" cy="138" r="13"/><rect x="88" y="144" width="4" height="12"/>
        <circle cx="126" cy="146" r="9"/><rect x="124" y="150" width="4" height="9"/>
        <circle cx="740" cy="140" r="14"/><rect x="738" y="146" width="4" height="13"/>
      </g>
      <!-- greenhouse -->
      <g>
        <path class="ghg" d="M330 158 L330 138 Q345 126 360 138 L360 158 Z" fill="#b8d4c2" opacity=".22"/>
        <path d="M330 158 L330 138 Q345 126 360 138 L360 158" fill="none" stroke="#dfe8db" stroke-width="1.4" opacity=".6"/>
        <path d="M338 158 V133 M352 158 V133 M330 146 H360" stroke="#dfe8db" stroke-width="0.8" opacity=".45"/>
      </g>
      <!-- manor -->
      <g id="manor">
        <rect x="470" y="112" width="130" height="48" fill="#132018"/>
        <polygon points="464,112 535,88 606,112" fill="#0d1812"/>
        <rect x="452" y="124" width="26" height="36" fill="#101c14"/>
        <polygon points="448,124 465,110 482,124" fill="#0c1610"/>
        <rect x="598" y="124" width="26" height="36" fill="#101c14"/>
        <polygon points="594,124 611,110 628,124" fill="#0c1610"/>
        <rect x="519" y="80" width="7" height="16" fill="#0d1812"/>
        <g id="smoke" fill="#c9c4b2">
          <path d="M521 76 q 4 -7 -1 -12 q 6 2 4 -8" stroke="#c9c4b2" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
        <rect class="winw" x="484" y="122" width="9" height="13"/>

let AC=null;
function audioInit(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume(); }
function tone(freq, dur, type, vol, slideTo){
  if(!AC || (S&&S.muted)) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, AC.currentTime+dur);
  g.gain.value=vol||0.08;
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime+dur);
}

  love: ()=>{tone(659,0.1,'sine',0.08); setTimeout(()=>tone(988,0.16,'sine',0.07),90);},
  bad:  ()=>tone(180,0.3,'sawtooth',0.09,60),

/* ── Plant simulation (per game-minute) ──────────────────────────── */
function minutePlants(){
  for(const eid in S.estates){
    const est=S.estates[eid]; if(!est.owned) continue;
    const hasGardener = gardenersAt(eid)>0;
    for(const p of est.plots){
      if(!p.strain) continue;
      const st=strain(p.strain);
      if(hasGardener) p.water=100;
      if(p.water>0){ p.water=Math.max(0,p.water-waterDrain()); p.grown+=growSpeed(); }
      else if(p.grown<st.grow) p.dry=true;
      if(p.grown>=st.grow && hasGardener) harvestPlot(eid,p,true);
    }
  }
}
function harvestPlot(eid,p,auto,mult){
  mult=mult||1;
  const st=strain(p.strain);
  const y=Math.max(1, Math.round(calcYield(st,p.dry)*mult));
  S.inv[st.id]=(S.inv[st.id]||0)+y;
  S.stats.harvests++;
  addRep(mult>=1.4?3:1);
  const est=S.estates[eid];
  const wasDry=p.dry, sid=p.strain;
  p.strain=null; p.grown=0; p.water=0; p.dry=false;
  if(auto && est.autoReplant){
    if(S.seeds[sid]>0){ S.seeds[sid]--; p.strain=sid; p.water=100; }
    else if(S.cash>=st.seed){ S.cash-=st.seed; p.strain=sid; p.water=100; }
  }
  if(!auto){
    const tag = mult>=1.4?' — ✨ <b>Perfect Trim!</b>' : mult>1?' — good trim' : '';
    toast(`Harvested <b>${y}× ${st.name}</b>${tag}${wasDry?' (drought-stunted)':''}`);
    fxBurst(mult>=1.4?'✨':'🍃', mult>=1.4?10:7); fxText('+'+y+' '+st.em,'#8fd8a8');
  }
  else log(`Gardener harvested ${y}× ${st.name} at ${ESTATES.find(e=>e.id===eid).name}.`);
  chkAch();
}

/* ── Street offers ───────────────────────────────────────────────── */
function abs(){ return S.absMin; }
function minuteOffers(){
  S.offers = S.offers.filter(o=>{ if(abs()>o.expires){ log(`A buyer for ${strain(o.strain).name} got tired of waiting.`,true); return false;} return true; });
  const h=S.min/60;
  if(h<9 && h>2) return;
  if(S.offers.length>=3) return;
  const have = Object.keys(S.inv).filter(k=>S.inv[k]>0);
  let chance = (1/90)*(1+S.rep/200)*(up('burner')?1.6:1)*(lux('motor')?1.15:1);
  if(!have.length) chance/=4;
  if(Math.random()<chance) makeOffer(have);
}
function makeOffer(have){
  const sid = have.length ? pick(have) : STRAINS.filter(s=>S.rep>=s.rep)[0].id;
  const st=strain(sid);
  const qty=ri(2, 4+Math.floor(S.rep/50));
  const mult=rnd(0.85,1.4)*mkt(sid);
  const price=Math.round(st.value*mult);
  const heat=dealHeat(qty);
  S.offers.push({id:S.nextOfferId++, strain:sid, qty, price, heat, expires:abs()+90, haggled:false});
  toast(`🤝 A buyer wants <b>${qty}× ${st.name}</b> @ ${fmt(price)}/ea`);
  render();
}
function sellToOffer(o){
  const q=Math.min(o.qty, S.inv[o.strain]||0);
  if(q<=0){ toast('You have none of that in stock.', true); return; }
  S.inv[o.strain]-=q;
  const total=q*o.price;
  earnCash(total);
  addHeat(o.heat);
  addRep(Math.ceil(q/3));
  S.stats.sold+=q;
  S.offers=S.offers.filter(x=>x.id!==o.id);
  log(`Sold ${q}× ${strain(o.strain).name} on the street for ${fmt(total)}.`);
  toast(`💷 +${fmt(total)} cash <span class="muted">(+${o.heat} heat)</span>`);
  fxText('+'+fmt(total),'#d9b45b'); fxBurst('💷',5); sfx('cash');
  chkAch();
  render();
}

/* ── Contracts ───────────────────────────────────────────────────── */
function genContract(){
  const avail=STRAINS.filter(s=>S.rep>=s.rep);
  const st=pick(avail.slice(-3));
  const qty=ri(10, 18+Math.floor(S.rep/40));
  const days=ri(2,4)+(lux('boat')?1:0);
  const c={id:S.nextContractId++, strain:st.id, qty, deadline:S.day+days, mult:+rnd(1.4,1.8).toFixed(2)};
  S.contracts.push(c);
  const pay=Math.round(qty*st.value*c.mult);
  log(`New contract: ${qty}× ${st.name} within ${days} days for ${fmt(pay)} clean.`);
  toast(`📜 <b>Contract:</b> ${qty}× ${st.name}, ${days} days, ${fmt(pay)} to the bank`);
}
function deliverContract(id){
  const c=S.contracts.find(x=>x.id===id); if(!c) return;
  const st=strain(c.strain);
  if((S.inv[c.strain]||0)<c.qty){ toast('Not enough product in stock.',true); return; }
  S.inv[c.strain]-=c.qty;
  const pay=Math.round(c.qty*st.value*c.mult);
  S.bank+=pay; S.stats.earned+=pay; S.stats.sold+=c.qty; S.stats.contracts++;
  addRep(Math.ceil(c.qty/2));
  S.contracts=S.contracts.filter(x=>x.id!==id);
  log(`Contract fulfilled: ${c.qty}× ${st.name} for ${fmt(pay)} clean.`);
  toast(`📜 Contract paid: <b class="money">+${fmt(pay)}</b> to the bank`);
  fxText('+'+fmt(pay),'#5fbf7f'); fxBurst('📜',4);
  chkAch(); render(); save();
}

/* ── Dealers ─────────────────────────────────────────────────────── */
function minuteDealers(){
  const h=S.min/60;
  if(h<10||h>=22) return;
  const dealers=countRole('dealer');
  const rate=up('cellar')?0.9:0.8;
  for(let i=0;i<dealers;i++){
    if(Math.random()>1/80) continue;
    const have=Object.keys(S.inv).filter(k=>S.inv[k]>0)
      .sort((a,b)=>strain(b).value-strain(a).value);
    if(!have.length) return;
    const sid=have[0], st=strain(sid);
    const q=Math.min(ri(1,3), S.inv[sid]);
    S.inv[sid]-=q;
    const total=Math.round(q*st.value*mkt(sid)*rate);
    earnCash(total);
    addHeat(1);
    S.stats.sold+=q;
    log(`A runner moved ${q}× ${st.name} for ${fmt(total)}.`);
  }
}

/* ── Dawn settlement (06:00) ─────────────────────────────────────── */
function rollMarket(){
  for(const st of STRAINS) S.market[st.id]=+rnd(0.8,1.3).toFixed(2);
}
function settle(){
  S.day++; S.stats.daysPlayed++;
  let notes=[];
  // wages (cash)
  const wages=S.staff.reduce((a,s)=>a+ROLES[s.role].wage,0);
  if(wages>0){
    if(S.cash>=wages){ S.cash-=wages; notes.push(`Wages paid: ${fmt(wages)}`); }
    else{
      const q=S.staff.pop();
      addRep(-5);
      notes.push(`Couldn't make payroll — ${ROLES[q.role].name} ${q.name} walked. (-5 rep)`);
    }
  }
  // lord fees (bank, fallback cash at 1.5x)
  let fees=0;
  for(const e of ESTATES){ if(S.estates[e.id]?.owned) fees+=e.fee; }
  if(fees>0){
    if(S.bank>=fees){ S.bank-=fees; notes.push(`Lords' consideration: ${fmt(fees)} (bank)`); }
    else if(S.cash>=fees*1.5){ S.cash-=Math.round(fees*1.5); addHeat(3);
      notes.push(`Paid the lords in used notes: ${fmt(fees*1.5)}. They noticed. (+3 heat)`); }
    else { addHeat(8); addRep(-3); notes.push(`The lords went unpaid. Word spreads. (+8 heat, -3 rep)`); }
  }
  // laundering
  const cap=FRONTS.reduce((a,f)=>a+(S.fronts[f.id]?f.launder:0),0);
  if(cap>0 && S.cash>0){
    const amt=Math.min(S.cash,cap);
    const cleaned=Math.round(amt*0.9);
    S.cash-=amt; S.bank+=cleaned; S.stats.laundered+=cleaned;
    notes.push(`Fronts laundered ${fmt(amt)} → ${fmt(cleaned)} clean.`);
  }
  // turf income & rival pressure
  const held=ownedTurf();
  if(held.length){
    const inc=held.reduce((a,d)=>a+d.income,0);
    earnCash(inc);
    const turfHeat=held.reduce((a,d)=>a+d.str,0);   // heat scales with district strength
    S.heat=clamp(S.heat+turfHeat,0,100);
    notes.push(`Your corners kicked up ${fmt(inc)} street cash. (+${turfHeat} heat)`);
    // take-back chance rises with number of districts held; Nia and dead rival leaders soften it
    let tbChance=(0.10+0.05*held.length)*(partnered('nia')?0.4:1);
    for(const d of held){ if(S.hits[d.id]) tbChance*=0.6; }
    if(Math.random() < tbChance){
      const d=pick(held);
      if(countRole('enforcer')>=d.str){
        addRep(5); S.cash=Math.max(0,S.cash-500);
        notes.push(`${d.crew} moved on ${d.name} — your enforcers held the line. (+5 rep, £500 in medical bills)`);
      } else {
        delete S.turf[d.id]; addRep(-8);
        notes.push(`${d.crew} took back ${d.name} overnight. (-8 rep)`);
      }
    }
  }
  // community upkeep (cash) + trust decay drift toward investment level
  let upkeep=0; for(const c of COMMUNITY){ if(S.community[c.id]) upkeep+=c.upkeep; }
  if(upkeep>0){
    if(S.cash>=upkeep){ S.cash-=upkeep; notes.push(`Community upkeep: ${fmt(upkeep)}.`); }
    else { addTrust(-8); notes.push(`Couldn't fund the community projects. Trust slips. (-8 trust)`); }
  }
  // family stipend (cash) — the cost, and the reason, to get out clean
  if(S.family.length){
    const keep=S.family.length*200;
    if(S.cash>=keep){ S.cash-=keep; notes.push(`Family upkeep: ${fmt(keep)}.`); }
    else if(S.bank>=keep){ S.bank-=keep; notes.push(`Family upkeep from the bank: ${fmt(keep)}.`); }
    else { addTrust(-2); notes.push('Money was tight at home this week.'); }
  }
  // racehorse
  if(lux('horse')){
    const r=Math.random();
    if(r<0.2){ const w=ri(1000,4000); S.bank+=w; S.stats.earned+=w; notes.push(`Liquid Asset romped home at Ascot: +${fmt(w)} (bank).`); }
    else if(r<0.25){ S.cash=Math.max(0,S.cash-800); notes.push('Vet bill for Liquid Asset: £800. He regrets nothing.'); }
  }
  // heat decay (fixers, penthouse, civilian partner, community trust)
  let cool=4 + countRole('fixer')*10 + (lux('pent')?3:0) + (partnered('flora')?2:0) + Math.floor(S.trust/25);
  if(S.heat>0){ const before=S.heat; S.heat=clamp(S.heat-cool,0,100);
    notes.push(`Heat cooled ${before}→${S.heat}.`); }
  // contracts: expire + maybe generate
  S.contracts=S.contracts.filter(c=>{
    if(S.day>c.deadline){ addRep(-5); log(`Contract for ${strain(c.strain).name} expired. Your word suffers. (-5 rep)`,true); return false; }
    return true;
  });
  if(S.contracts.length<2 && S.rep>=30 && Math.random()<0.5) genContract();
  // market shift
  rollMarket();
  // raid check (gamekeepers reduce)
  const guardCut=1-0.2*Math.min(countRole('guard'),3);
  if(S.heat>=70 && Math.random()*100 < (S.heat-55)*1.5*guardCut) raid();
  // schedule today's random event
  S.eventMin = (Math.random()<0.4) ? ri(10*60, 21*60) : null;
  notes.forEach(n=>log(n));
  toast(`🌅 <b>Dawn, day ${S.day}.</b> ` + (notes[0]||''), false);
  chkAch();
  save();
}

/* ── Raids ───────────────────────────────────────────────────────── */
function raidSeverity(){ return (countRole('barrister')>0?0.5:1) * (up('vault')?0.5:1) * (partnered('grace')?0.75:1); }
function raid(){
  S.stats.raids++;
  shake(); sfx('bad'); pushWar('hq');
  const sev=raidSeverity();
  const e=pick(ownedEstates());
  const est=S.estates[e.id];
  let plantsLost=0;
  for(const p of est.plots){ if(p.strain){ plantsLost++; p.strain=null; p.grown=0; p.water=0; p.dry=false; } }
  let seized=0;
  for(const k in S.inv){ const take=Math.floor(S.inv[k]*0.4*sev); S.inv[k]-=take; seized+=take; }
  const fine=Math.round((500+S.day*80)*sev);
  S.cash=Math.max(0,S.cash-fine);
  S.heat=45;
  const msg=`🚨 <b>RAID at ${e.name}!</b> ${plantsLost} plants destroyed, ${seized} units seized, ${fmt(fine)} in "fines".`
    + (countRole('barrister')?' Your barrister softened the blow.':'');
  log(msg.replace(/<[^>]+>/g,''), true);
  chkAch();
  showModal(`<h2>🚨 Police Raid</h2><p>${msg}</p>
    <p class="muted">Keep heat below 70 — bribe, hire fixers and gamekeepers, or lie low.</p>
    <div class="choices"><button onclick="A.close()">Regroup</button></div>`);
}
function bigRaid(){
  if(S._bigRaidLock) return; S._bigRaidLock=true;
  setTimeout(()=>{ S._bigRaidLock=false; },100);
  S.stats.raids++;
  shake(); pushWar('hq');
  let seized=0;
  for(const k in S.inv){ const take=Math.floor(S.inv[k]*0.75); S.inv[k]-=take; seized+=take; }
  for(const eid in S.estates){ for(const p of S.estates[eid].plots){ p.strain=null;p.grown=0;p.water=0;p.dry=false; } }
  const fine=Math.round(S.cash*0.3);
  S.cash-=fine; S.heat=55;
  log(`MAJOR CRACKDOWN: every grow torched, ${seized} units and ${fmt(fine)} seized.`, true);
  chkAch();
  showModal(`<h2>🚁 Major Crackdown</h2>
    <p>Heat hit 100. Helicopters over every estate. They torched <b>every plant</b>, seized <b>${seized} units</b> and ${fmt(fine)} in cash.</p>
    <p class="muted">You kept your freedom — barely. Watch the heat bar.</p>
    <div class="choices"><button onclick="A.close()">Start again, quietly</button></div>`);
}

      {t:'Refuse', s:'30% they hit a corner', f(){ if(Math.random()<0.3&&ownedTurf().length){ const d=ownedTurf().sort((a,b)=>a.str-b.str)[0]; delete S.turf[d.id]; addRep(-5); return `Three nights later, ${d.name} is theirs again. -5 rep.`; } addRep(8); return 'The polite men leave. Nothing happens. Sometimes the bluff is the whole hand. +8 rep.'; }},
      {t:'Declare war on the docks', s:'+25 rep, +20 heat', f(){ addRep(25); addHeat(20); return 'You send back their envelope, empty, with a wharf timetable inside. The whole city holds its breath. +25 rep, +20 heat.'; }},
    ]
  },
  {
    title:'Two Runners, One Wedding', em:'💍',
    text:'Two of your crew are getting married — to each other. They\'d like the reception at one of your estates. The whole firm is watching how you respond.',
    cond:()=>S.staff.length>=2,
    choices:[
      {t:'Host it, spare no expense (£1,500)', s:'+20 rep', f(){ if(S.cash<1500)return 'Not enough cash.'; S.cash-=1500; addRep(20); return 'A legendary do. The crew would now walk through fire for you. +20 rep.'; }},
      {t:'Give your blessing, nothing more', s:'Free goodwill', f(){ addRep(6); return 'A warm handshake and an afternoon off. Decent of you. +6 rep.'; }},
      {t:'Forbid workplace romance', s:'Discipline has costs', f(){ addRep(-10); return 'The mood in the firm turns arctic. -10 rep.'; }},
    ]
  },
];
function anyPlants(){ return Object.values(S.estates).some(e=>e.owned&&e.plots.some(p=>p.strain)); }
function bestGardenEstate(){
  const owned=ownedEstates();
  owned.sort((a,b)=>gardenersAt(a.id)-gardenersAt(b.id));
  return owned[0].id;
}
function fireEvent(){
  const pool=EVENTS.filter(e=>!e.cond||e.cond());
  if(!pool.length) return;
  pendingEvent=pick(pool);
  const e=pendingEvent;
  showModal(`<h2>${e.em} ${e.title}</h2><p>${e.text}</p>
    <div class="choices">${e.choices.map((c,i)=>
      `<button onclick="A.evChoice(${i})">${c.t}<small>${c.s}</small></button>`).join('')}</div>`);
}

/* ── Actions ─────────────────────────────────────────────────────── */
const A = {
  tab(t){ S.tab=t; render(); },
  speed(n){ S.speed=n; renderHUD(); },
  close(){ closeModal(); },

  evChoice(i){
    if(!pendingEvent) return;
    const res=pendingEvent.choices[i].f();
    if(res && (res.startsWith('Not enough')||res.startsWith('You don'))){ toast(res,true); return; }
    log(`${pendingEvent.title}: ${res.replace(/<[^>]+>/g,'')}`);
    showModal(`<h2>${pendingEvent.em} ${pendingEvent.title}</h2><p>${res}</p>
      <div class="choices"><button onclick="A.close()">Carry on</button></div>`);
    pendingEvent=null; chkAch(); save();
  },

  plot(eid,i){
    const p=S.estates[eid].plots[i];
    if(!p.strain){ this.pickStrain(eid,i); return; }
    const st=strain(p.strain);
    if(p.grown>=st.grow){ harvestMini(eid,i); return; }
    p.water=100; toast(`💧 Watered the ${st.name}.`); fxBurst('💧',3); render();
  },
  trimStop(eid,i){
    stopMini();
    const p=S.estates[eid]?.plots[i];
    if(!p||!p.strain){ closeModal(); return; }
    const pos=miniPos;
    let mult=1;
    if(pos>=0.44&&pos<=0.56){ mult=1.4; sfx('win'); }
    else if(pos>=0.26&&pos<=0.74){ mult=1.15; sfx('buy'); }
    else sfx('click');
    harvestPlot(eid,p,false,mult);
    closeModal(); save();
  },
  pickStrain(eid,i){
    const rows=STRAINS.map(s=>{
      const stash=S.seeds[s.id]||0;
      const unlocked=S.rep>=s.rep||stash>0;
      const afford=S.cash>=s.seed||stash>0;
      const label = stash>0 ? `${stash} in stash` : fmt(s.seed);
      return `<button ${(!unlocked||!afford)?'disabled':''} onclick="A.plant('${eid}',${i},'${s.id}')">
        ${s.em} <b>${s.name}</b> — ${label}
        <small>${unlocked?`${s.blurb} · grows ${Math.round(s.grow/60)}h · ~${s.yield} units @ ${fmt(s.value)}`
          :`🔒 Requires ${s.rep} rep`}</small></button>`;
    }).join('');
    showModal(`<h2>🌱 Plant a strain</h2><p class="muted">Seeds are bought with street cash.</p>
      <div class="choices">${rows}<button class="ghost" onclick="A.close()">Cancel</button></div>`);
  },
  plant(eid,i,sid){
    const st=strain(sid);
    if(S.seeds[sid]>0) S.seeds[sid]--;
    else if(S.cash>=st.seed) S.cash-=st.seed;
    else { toast('Not enough cash.',true); return; }
    const p=S.estates[eid].plots[i];
    p.strain=sid; p.grown=0; p.water=100; p.dry=false;
    closeModal(); toast(`Planted ${st.em} ${st.name}.`); fxBurst('🌱',4); sfx('plant'); save();
  },
  autoReplant(eid){ S.estates[eid].autoReplant=!S.estates[eid].autoReplant; render(); save(); },

  buyEstate(id){
    const e=ESTATES.find(x=>x.id===id);
    if(S.bank<e.cost){ toast('Lords only accept clean bank money.',true); return; }
    S.bank-=e.cost;
    S.estates[id]={owned:true, autoReplant:false, plots:mkPlots(e.plots+(up('greenhouse')?2:0))};
    log(`Leased ${e.name} from ${e.lord}.`);
    toast(`🏛️ <b>${e.name}</b> is yours.`);
    fxBurst('🏛️',5); sfx('buy');
    chkAch(); render(); save();
  },

  hire(role){
    const r=ROLES[role];
    if(countRole(role)>=r.max){ toast(`You can't employ more ${r.name}s.`,true); return; }
    if(S.cash<r.hire){ toast('Not enough cash.',true); return; }
    S.cash-=r.hire;
    const rec={role, name:pick(NAMES), estate:role==='gardener'?bestGardenEstate():null};
    S.staff.push(rec);
    log(`Hired ${r.name} ${rec.name}${rec.estate?` for ${ESTATES.find(e=>e.id===rec.estate).name}`:''}.`);
    toast(`${r.em} Hired <b>${rec.name}</b> the ${r.name}.`);
    chkAch(); render(); save();
  },
  fire(idx){
    const s=S.staff[idx]; if(!s) return;
    S.staff.splice(idx,1);
    log(`Let ${s.name} go.`);
    render(); save();
  },
  moveGardener(idx){
    const s=S.staff[idx]; if(!s||s.role!=='gardener') return;
    const owned=ownedEstates();
    const cur=owned.findIndex(e=>e.id===s.estate);
    s.estate=owned[(cur+1)%owned.length].id;
    render(); save();
  },

  buyFront(id){
    const f=FRONTS.find(x=>x.id===id);
    if(S.cash<f.cost){ toast('Not enough cash.',true); return; }
    S.cash-=f.cost; S.fronts[id]=true;
    log(`Acquired ${f.name}. Laundering +${fmt(f.launder)}/day.`);
    toast(`${f.em} <b>${f.name}</b> acquired.`);
    render(); save();
  },
  buyUpgrade(id){
    const u=UPGRADES.find(x=>x.id===id);
    if(S.cash<u.cost){ toast('Not enough cash.',true); return; }
    S.cash-=u.cost; S.upgrades[id]=true;
    if(id==='greenhouse'){
      for(const eid in S.estates){ if(S.estates[eid].owned){ S.estates[eid].plots.push({strain:null,grown:0,water:0,dry:false},{strain:null,grown:0,water:0,dry:false}); } }
    }
    log(`Upgrade: ${u.name}.`);
    toast(`${u.em} <b>${u.name}</b> installed.`);
    render(); save();
  },
  withdraw(){
    const amts=[1000,5000,25000];
    const half=Math.floor(S.bank/2);
    showModal(`<h2>🏦 Private Bank</h2>
      <p class="muted">Balance: <b class="money">${fmt(S.bank)}</b>. Withdraw clean money as spendable street cash — free of charge. It is, after all, your money.</p>
      <div class="choices">
      ${amts.map(a=>`<button ${S.bank<a?'disabled':''} onclick="A.wd(${a})">Withdraw ${fmt(a)}</button>`).join('')}
      <button ${half<=0?'disabled':''} onclick="A.wd(${half})">Withdraw half (${fmt(half)})</button>
      <button ${S.bank<=0?'disabled':''} onclick="A.wd(${S.bank})">Withdraw everything (${fmt(S.bank)})</button>
      <button class="ghost" onclick="A.close()">Cancel</button></div>`);
  },
  wd(a){
    a=Math.min(Math.floor(a), S.bank);
    if(a<=0) return;
    S.bank-=a; S.cash+=a;
    log(`Withdrew ${fmt(a)} from the bank.`);
    toast(`🏦 Withdrew <b class="dirty">${fmt(a)}</b> in cash.`);
    fxText('+'+fmt(a),'#d9b45b');
    closeModal(); save();
  },
  buyLux(id){
    const l=LUXURY.find(x=>x.id===id);
    if(S.luxury[id]) return;
    if(l.cur==='bank'){ if(S.bank<l.cost){ toast('Not enough clean money — luxuries need receipts.',true); return; } S.bank-=l.cost; }
    else { if(S.cash<l.cost){ toast('Not enough cash.',true); return; } S.cash-=l.cost; }
    S.luxury[id]=true;
    addRep(l.rep);
    log(`Acquired ${l.name}. (+${l.rep} rep)`);
    toast(`${l.em} <b>${l.name}</b> is yours. +${l.rep} rep.`);
    fxBurst(l.em,5);
    chkAch(); render(); save();
  },
  takeover(id){
    const d=DISTRICTS.find(x=>x.id===id);
    if(!d||S.turf[id]) return;
    const enf=countRole('enforcer');
    const weakened=!!S.hits[id];
    const need=weakened?Math.max(1,d.str-1):d.str;
    const cost=weakened?Math.round(d.str*1000*0.5):d.str*1000;
    if(enf<need){ toast(`You need at least ${need} enforcer${need>1?'s':''} for ${d.name}.`,true); return; }
    if(S.cash<cost){ toast('Not enough cash to fund the move.',true); return; }
    S.cash-=cost;
    const p=Math.min(0.95, 0.5+0.15*(enf-need)+(weakened?0.25:0));
    if(Math.random()<p){
      S.turf[id]=true; addHeat(10); addRep(10*d.str); S.stats.turf++;
      log(`Took ${d.name} from ${d.crew}. (+${10*d.str} rep, +10 heat)`);
      fxBurst('⚔️',6); shake(); sfx('win'); pushWar('turf');
      showModal(`<h2>⚔️ ${d.name} Is Yours</h2>
        <p>Your enforcers moved at closing time. By sunrise, ${d.crew} were nursing bruises and the corner was yours.</p>
        <p class="muted">+${fmt(d.income)}/day street cash at dawn · +${10*d.str} rep · +10 heat. They will want it back — keep ${d.str}+ enforcers on the books.</p>
        <div class="choices"><button class="gold" onclick="A.close()">Run it</button></div>`);
    } else {
      addHeat(8);
      const i=S.staff.findIndex(s=>s.role==='enforcer');
      if(i>=0){ const lost=S.staff.splice(i,1)[0];
        log(`Move on ${d.name} failed — ${lost.name} is in hospital. (+8 heat)`,true);
        toast(`🚑 The move failed. <b>${lost.name}</b> is in hospital.`,true);
      } else {
        log(`Move on ${d.name} failed. (+8 heat)`,true);
        toast('The move failed.',true);
      }
      shake(); pushWar('turf');
    }
    chkAch(); render(); save();
  },
  /* ── Relationships ── */
  date(id){
    const p=person(id);
    if(S.dateDoneDay===S.day){ toast('You\'ve already spent your evening today.',true); return; }
    const funds=p.date.cur==='bank'?S.bank:S.cash;
    if(funds<p.date.cost){ toast('Not enough for a proper date.',true); return; }
    if(p.date.cur==='bank') S.bank-=p.date.cost; else S.cash-=p.date.cost;
    S.dateDoneDay=S.day;
    // affection gain, modified by whether your life suits them
    let gain=ri(8,14);
    let flavor='';
    if(!p.trade && S.heat>=60){ gain-=6; flavor=` ${p.name.split(' ')[0]} noticed the police interest. It cooled the mood.`; }
    if(p.id==='nia' && ownedTurf().length>=1){ gain+=4; flavor=' Talk of the takeover clearly did something for her.'; }
    if(p.id==='grace' && S.heat>=40){ gain+=4; flavor=' The whiff of danger only drew her closer.'; }
    if(p.id==='kojo' && Object.keys(S.luxury).length>=2){ gain+=4; flavor=' Being seen with you, dripping, is exactly her brand.'; }
    if(p.id==='kojo' && Object.keys(S.luxury).length===0){ gain-=4; flavor=' She\'d hoped you\'d show up flashier.'; }
    S.people[id]=clamp(aff(id)+gain,0,100);
    S.stats.dates++;
    sfx('love');
    log(`Took ${p.name} out for ${p.date.name}. (+${gain} affection)`);
    toast(`${p.em} A lovely evening with <b>${p.name.split(' ')[0]}</b>. <span class="heart">+${gain} ♥</span>${flavor?' '+flavor:''}`);
    fxBurst('❤️',5);
    chkAch(); render(); save();
  },
  commit(id){
    const p=person(id);
    if(aff(id)<PEOPLE_CROSS){ toast('It\'s not there yet. Keep spending time together.',true); return; }
    if(S.married && S.married!==id){ toast('You\'re already committed to someone else.',true); return; }
    S.married=id; if(aff(id)<70) S.people[id]=70;
    log(`Made it official with ${p.name}.`);
    toast(`${p.em} You and <b>${p.name.split(' ')[0]}</b> are officially together. <span class="muted">${p.perk}</span>`);
    fxBurst('❤️',8);
    chkAch(); render(); save();
  },
  marry(id){
    const p=person(id);
    if(!partnered(id)){ toast('Commit first.',true); return; }
    if(aff(id)<PEOPLE_MARRY){ toast('Not yet — grow closer first.',true); return; }
    if(S.married!=='m:'+id){ /* mark married via flag */ }
    S._weddings=S._weddings||{}; S._weddings[id]=true;
    addRep(30);
    log(`Married ${p.name}.`);
    award('love');
    sfx('win');
    showModal(`<h2>💍 A Wedding</h2>
      <p>You and <b>${p.name}</b> are married. ${p.trade?'Two people who know exactly what the other does — and chose each other anyway.':'They know what you are now. They married you anyway. That means something.'}</p>
      <p class="muted">Perk secured: ${p.perk}</p>
      <div class="choices">
      <button class="gold" onclick="A.startFamily('${id}')">Start a family together</button>
      <button class="ghost" onclick="A.close()">Just the two of us, for now</button></div>`);
    fxBurst('💍',10);
    chkAch(); render(); save();
  },
  startFamily(id){
    const p=person(id);
    if(!S._weddings || !S._weddings[id]){ toast('Marry first.',true); return; }
    if(S.family.length>=3){ toast('Your household is full and loud enough.',true); return; }
    const kid=pick(['a daughter','a son','twins','a little one']);
    S.family.push({parent:id, who:kid});
    addRepBase(10);
    log(`Started a family with ${p.name}: ${kid}.`);
    award('family');
    showModal(`<h2>👶 A Family</h2>
      <p>Congratulations — ${kid}. Everything is different now. There's someone to get out clean <i>for</i>.</p>
      <p class="muted">Family costs a little cash each dawn, but changes how your story can end.</p>
      <div class="choices"><button class="gold" onclick="A.close()">Hold them close</button></div>`);
    fxBurst('👶',8);
    chkAch(); render(); save();
  },

  /* ── Wet work ── */
  orderHit(id){
    const d=district(id);
    showModal(`<h2>🎯 A Word With ${d.crew}</h2>
      <p>You can have ${d.crew}'s leadership removed. Their district is permanently weakened — cheaper to take, far less likely to fight back — but this is the line a lot of people never come back from.</p>
      <p class="muted">Cost: <b class="dirty">${fmt(d.str*3000)}</b> cash · <b class="bad">+${d.str*4} heat</b> · your civilian partner will not approve · community trust falls.</p>
      <div class="choices">
      <button class="danger" onclick="A.doHit('${id}')">Give the order (${fmt(d.str*3000)})</button>
      <button class="ghost" onclick="A.close()">Not today</button></div>`);
  },
  doHit(id){
    const d=district(id);
    const cost=d.str*3000;
    if(S.cash<cost){ toast('Not enough cash for that kind of work.',true); closeModal(); return; }
    S.cash-=cost;
    S.hits[id]=true;
    addHeat(d.str*4);
    addTrust(-15);
    S.stats.hits++;
    shake(); sfx('bad'); pushWar('turf');
    // civilian partner recoils
    let partnerNote='';
    const pr=S.married && person(S.married);
    if(pr && !pr.trade){ S.people[S.married]=clamp(aff(S.married)-25,0,100); partnerNote=` ${pr.name.split(' ')[0]} can see it on you. Something closed off in them. (-25 ♥)`; }
    log(`Ordered a hit on ${d.crew}'s leadership. (+${d.str*4} heat, -15 trust)`,true);
    showModal(`<h2>🎯 It's Done</h2>
      <p>${d.crew} are leaderless and reeling. ${d.name} will fall easily now and they won't be taking it back in a hurry.</p>
      <p class="bad">${partnerNote||'The street got a little colder tonight.'}</p>
      <div class="choices"><button onclick="A.close()">Live with it</button></div>`);
    chkAch(); render(); save();
  },

  /* ── Community ── */
  invest(id){
    const c=COMMUNITY.find(x=>x.id===id);
    if(S.community[id]) return;
    if(S.cash<c.cost){ toast('Not enough cash.',true); return; }
    S.cash-=c.cost; S.community[id]=true;
    addTrust(c.trust); addRepBase(Math.round(c.trust/2));
    log(`Invested in ${c.name}. (+${c.trust} community trust)`);
    toast(`${c.em} <b>${c.name}</b> is open. The estate notices. <span class="muted">+${c.trust} trust</span>`);
    fxBurst('🕊️',5); sfx('buy');
    chkAch(); render(); save();
  },

  /* ── Sound & title ── */
  mute(){ S.muted=!S.muted; $('muteBtn').textContent=S.muted?'🔇':'🔊'; if(!S.muted) sfx('click'); save(); },
  startGame(fresh){
    audioInit();
    if(fresh){ localStorage.removeItem(SAVE_KEY); S=freshState(); rollMarket(); }
    $('title').style.display='none';
    if(!S.seenIntro) intro(); else render();
  },

  bribe(){
    const cost=Math.round(300+S.heat*25);
    if(S.cash<cost){ toast('Not enough cash.',true); return; }
    if(S.heat<5){ toast('Heat is already negligible.',true); return; }
    S.cash-=cost; addHeat(-20); S.stats.bribes++;
    log(`Bribe paid: ${fmt(cost)}, -20 heat.`);
    toast(`🤫 Palms greased. <b>-20 heat</b>.`);
    render(); save();
  },

  accept(id){ const o=S.offers.find(x=>x.id===id); if(o) sellToOffer(o); save(); },
  haggle(id){ haggleMini(id); },
  haggleStop(id){
    stopMini();
    const o=S.offers.find(x=>x.id===id); if(!o){ closeModal(); return; }
    o.haggled=true;
    const pos=miniPos;
    // the Savile Row wardrobe / watch nudge the safe boundary higher (more forgiving)
    const walkAt=0.85+(up('tailor')?0.05:0)+(lux('watch')?0.02:0);
    if(pos>=walkAt){
      S.offers=S.offers.filter(x=>x.id!==id);
      toast('😤 You pushed too hard. They walked away.',true); sfx('bad');
    } else {
      const gain=1+Math.min(pos,0.85)/0.85*0.5;   // up to +50% at the top of the safe band
      o.price=Math.round(o.price*gain);
      const pct=Math.round((gain-1)*100);
      toast(pct>=30?`😏 Sharp work. Price now <b>${fmt(o.price)}/ea</b> (+${pct}%).`:`Price nudged to ${fmt(o.price)}/ea (+${pct}%).`);
      sfx(pct>=30?'cash':'click');
    }
    closeModal(); save();
  },
  decline(id){ S.offers=S.offers.filter(x=>x.id!==id); render(); },
  deliver(id){ deliverContract(id); },

  sleep(){
    if(modalOpen) return;
    let guard=200;
    while(guard-->0){
      S.min+=10; S.absMin+=10;
      if(S.min>=1440) S.min-=1440;
      for(let i=0;i<10;i++) minutePlants();
      minuteDealers();
      if(S.min>=360 && S.min<370){ S.min=360; settle(); break; }
    }
    S.minF=S.min;
    S.offers=[];
    toast('🌙 You lie low until dawn.');
    render(); save();
  },

  buyExit(){
    if(S.bank<exitCost()){ toast('Not enough clean money.',true); return; }
    S.bank-=exitCost(); S.won=true; S.speed=0;
    // Endings are chosen by how you lived — family and community first, then style.
    let title="🏝️ The Gentleman's Exit",
        flavor='Papers signed. Assets legitimised. A villa on the Riviera, a knighthood pending, and not a single fingerprint anywhere.';
    const married=S._weddings&&Object.keys(S._weddings)[0];
    if(S.family.length && S.stats.hits===0){ title='👨‍👩‍👧 Out, For Them';
      flavor=`You never crossed the final line, and now you never will. ${person(married).name.split(' ')[0]} and the kids don't know the half of it — and they never need to. A quiet house by the sea, and every dinner at the table. This was always the point.`; }
    else if(S.trust>=100){ title='🕊️ The People\'s Champion';
      flavor='The estate throws a street party the day you "retire". Youth clubs, scholarships, the centre with your name on the wall — they\'ll never know where the money came from, and they\'d forgive you if they did. You didn\'t just take from the ends. You built something.'; }
    else if(S.stats.hits>=3){ title='👑 King of the City';
      flavor='You leave a throne, not a life. Rivals buried, corners held, a name whispered with fear from the docks to the West End. You got everything you wanted. The villa is very quiet. You find you don\'t sleep much.'; }
    else if(S.stats.raids===0){ title='🕊️ The Immaculate Exit';
      flavor='Not one raid. Not one arrest. The police file on you is a single blank page. Scholars will argue you never existed.'; }
    else if(S.rep>=800){ title='👑 A Legend Departs';
      flavor='Ballads are sung in the villages. Lords name greenhouses after you. You leave not as a criminal, but as folklore.'; }
    else if(S.heat>=50){ title='🔥 By the Skin of Your Teeth';
      flavor='The helicopters were warming up as your plane lifted off. Rude gestures were exchanged. But you made it — rich, free, and extremely wanted.'; }
    award('won'); chkAch();
    showModal(`<h2>${title}</h2>
      <p>${flavor}</p>
      <p><b>You won in ${S.day} days.</b></p>
      <p class="muted">Sold ${S.stats.sold} units · earned ${fmt(S.stats.earned)} · ${S.stats.contracts} contracts ·
      ${S.stats.turf} corners · ${S.stats.hits} hits · survived ${S.stats.raids} raids ·
      ${married?'married · ':''}${S.family.length?S.family.length+' in the family · ':''}${Math.round(S.trust)} trust ·

/* ── Scenery ─────────────────────────────────────────────────────── */
const SKY=[
  [0,   '#070b18','#101527'],
  [5,   '#070b18','#1a2140'],
  [6.5, '#233a63','#d98555'],
  [8,   '#4a7bb5','#a8cbe8'],
  [12,  '#5b8fc7','#b8d8ef'],
  [17,  '#4a7bb5','#c9a06a'],
  [19.5,'#31335e','#d96a4e'],
  [21,  '#0d1230','#2a2350'],
  [24,  '#070b18','#101527'],
];
function hexLerp(a,b,t){
  const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16);
  const c=i=>Math.round(((pa>>i)&255)+(((pb>>i)&255)-((pa>>i)&255))*t);
  return '#'+((1<<24)|(c(16)<<16)|(c(8)<<8)|c(0)).toString(16).slice(1);
}
function nightFactor(h){
  if(h>=21||h<5) return 1;
  if(h>=5&&h<7.5) return 1-(h-5)/2.5;
  if(h>=19&&h<21) return (h-19)/2;
  return 0;
}
function updateScene(){
  const h=S.min/60;
  let i=0; while(i<SKY.length-1 && SKY[i+1][0]<=h) i++;
  const [h0,t0,b0]=SKY[i], [h1,t1,b1]=SKY[Math.min(i+1,SKY.length-1)];
  const t=(h1===h0)?0:clamp((h-h0)/(h1-h0),0,1);
  $('skyTop').setAttribute('stop-color', hexLerp(t0,t1,t));
  $('skyBot').setAttribute('stop-color', hexLerp(b0,b1,t));
  // sun: 6→20
  if(h>=6&&h<=20){
    const p=(h-6)/14;
    const x=60+680*p, y=155-115*Math.sin(Math.PI*p);
    $('sun').setAttribute('cx',x); $('sun').setAttribute('cy',y);
    $('sunGlow').setAttribute('cx',x); $('sunGlow').setAttribute('cy',y);
    $('sun').setAttribute('opacity',1); $('sunGlow').setAttribute('opacity',.18);
  } else { $('sun').setAttribute('opacity',0); $('sunGlow').setAttribute('opacity',0); }
  // moon: 20→6 (wrapped)
  const nf=nightFactor(h);
  if(h>=20||h<=6){
    const p=h>=20 ? (h-20)/10 : (h+4)/10;
    const x=60+680*p, y=150-110*Math.sin(Math.PI*p);
    $('moon').setAttribute('cx',x); $('moon').setAttribute('cy',y);
    $('moonC').setAttribute('cx',x-4); $('moonC').setAttribute('cy',y-4);
    $('moonG').setAttribute('opacity',Math.min(1,nf+.15));
  } else $('moonG').setAttribute('opacity',0);
  $('stars').setAttribute('opacity',nf*0.9);
  $('clouds').setAttribute('opacity',0.25+0.55*(1-nf));
  const sw=$('scenewrap');
  sw.classList.toggle('night', nf>0.5);
  sw.classList.toggle('hot', S.heat>=70);
  $('phase').textContent=phaseStr();
}

/* ── Plant SVG ───────────────────────────────────────────────────── */
function plantSVG(pct,dry,ready){
  const leaf = dry ? '#9a7a44' : '#5fbf7f';
  const stem = dry ? '#7a5c30' : '#3f9c62';
  const hgt = ready ? 32 : 8+24*(pct/100);
  const y0 = 43;
  let s = `<svg class="plantsvg" viewBox="0 0 48 48">`;
  s += `<ellipse cx="24" cy="44" rx="15" ry="3.5" fill="#332412"/>`;
  s += `<path d="M24 ${y0} V ${y0-hgt}" stroke="${stem}" stroke-width="2.4" stroke-linecap="round" fill="none"/>`;
  const pairs = Math.max(1, Math.min(4, Math.ceil((ready?100:Math.max(pct,8))/25)));
  for(let i=1;i<=pairs;i++){
    const ly=y0-hgt*(i/(pairs+0.6));
    const lw=11-i*1.6;
    s += `<ellipse cx="${24-lw*0.85}" cy="${ly-1}" rx="${lw}" ry="3.4" fill="${leaf}" transform="rotate(-24 ${24-lw*0.85} ${ly-1})"/>`;
    s += `<ellipse cx="${24+lw*0.85}" cy="${ly-1}" rx="${lw}" ry="3.4" fill="${leaf}" transform="rotate(24 ${24+lw*0.85} ${ly-1})"/>`;
  }
  if(ready){
    s += `<circle cx="24" cy="${y0-hgt-2}" r="4.2" fill="#cfe07a"/>`;
    s += `<circle cx="19" cy="${y0-hgt+4}" r="3.2" fill="#cfe07a"/>`;
    s += `<circle cx="29" cy="${y0-hgt+4}" r="3.2" fill="#cfe07a"/>`;
    s += `<text x="33" y="${y0-hgt-4}" font-size="10" class="sparkle">✨</text>`;
  }
  s += `</svg>`;
  return s;
}

/* ═══════════════════════════════════════════════════════════════════
   ISOMETRIC BASE VIEW — a little Townsmen/Diablo-angle town on canvas.
   Procedural, no assets. Reflects live game state; shows gang wars.
   ═══════════════════════════════════════════════════════════════════ */
const EMP_W=720, EMP_H=430;
const TW=30, TH=15;                 // iso tile half-width / half-height
const ORIGIN_X=EMP_W/2, ORIGIN_Y=96; // where grid (0,0) lands
let empRAF=null, peds=[], warFx=[], warUnseen=false, empRoadPts=null;
function isoPt(gx,gy){ return [ORIGIN_X+(gx-gy)*TW, ORIGIN_Y+(gx+gy)*TH]; }
function poly(ctx,pts,fill,stroke){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1; ctx.stroke(); }
}
// vertical light→dark gradient down a face, for form-giving shading
function vgrad(ctx,pts,top,bot){
  let y0=1e9,y1=-1e9; for(const p of pts){ if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }
  const g=ctx.createLinearGradient(0,y0,0,y1); g.addColorStop(0,top); g.addColorStop(1,bot);
  poly(ctx,pts,g);
}
// soft elliptical contact shadow on the ground
function softShadow(ctx,cx,cy,rx,ry,a){
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rx);
  g.addColorStop(0,`rgba(0,0,0,${a||0.32})`); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save(); ctx.translate(cx,cy); ctx.scale(1,ry/rx); ctx.beginPath(); ctx.arc(0,0,rx,0,7); ctx.fillStyle=g; ctx.fill(); ctx.restore();
}
// draw an iso cuboid whose ground footprint is (gx,gy)..(gx+gw,gy+gd), height h px.
// Faces are shaded with gradients + a consistent light: top brightest, right lit, left in shade.
function isoBox(ctx,gx,gy,gw,gd,h,top,lft,rgt){
  const b=isoPt(gx+gw,gy), c=isoPt(gx+gw,gy+gd), d=isoPt(gx,gy+gd), a=isoPt(gx,gy);
  const A=[a[0],a[1]-h],B=[b[0],b[1]-h],C=[c[0],c[1]-h],D=[d[0],d[1]-h];
  // some callers pass a transparent colour just to grab the corner coords — draw nothing then
  if(top!=='rgba(0,0,0,0)'){
    softShadow(ctx,(c[0]+d[0])/2+6,(c[1]+d[1])/2+3,(gw+gd)*10+10,(gw+gd)*5+5,0.22);
    vgrad(ctx,[d,c,C,D], shade(lft,6), shade(lft,-16));   // front-left face (shaded)
    vgrad(ctx,[b,c,C,B], shade(rgt,20), shade(rgt,-6));   // front-right face (lit)
    vgrad(ctx,[A,B,C,D], shade(top,14), shade(top,-2));   // top (brightest)
  }
  return {A,B,C,D,b,c,d};
}
function litWin(ctx,x,y,w,h,night){
  if(night>0.4){ softGlow(ctx,x+w/2,y+h/2,w*1.7,'rgba(255,222,140,'+(0.32*night).toFixed(2)+')');
    ctx.fillStyle='#ffe08a'; } else ctx.fillStyle='#1a2c20';
  ctx.fillRect(x,y,w,h);
}
// additive-ish soft glow blob (bloom)
function softGlow(ctx,x,y,r,col){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,col); g.addColorStop(1,col.replace(/[\d.]+\)$/,'0)'));
  const pc=ctx.globalCompositeOperation; ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  ctx.globalCompositeOperation=pc;
}

// Draw one estate building sized to a city block, back corner at (bx,by).
function drawBuilding(ctx,tier,bx,by,night,flag){

// Generic city filler building; grows taller/denser with your wealth & rep.
function drawGeneric(ctx,seed,bx,by,night){

    isoBox(ctx,bx+0.25,by+0.2,0.85,0.75,h,'#161b1f',c,shade(c,-10)); winGrid(ctx,bx+0.25,by+0.2,0.85,0.75,h,night,seed);

function winGrid(ctx,bx,by,w,d,h,night,seed){
  const a=isoPt(bx,by+d), b=isoPt(bx+w,by+d);   // front-left bottom edge
  const rows=Math.max(2,Math.floor(h/13));
  for(let r=0;r<rows;r++){ for(let c=0;c<3;c++){
    const fx=a[0]+(b[0]-a[0])*(0.22+c*0.28), fy=a[1]+(b[1]-a[1])*(0.22+c*0.28)-7-r*12;
    ctx.fillStyle=(night>0.4 && ((seed*7+r*3+c)%3!==0))?'#ffd75e':'#11181d';
    ctx.fillRect(fx-2,fy-4,3.5,5);
  }}
}
function roofPitch(ctx,box,rise,c1,c2){
  const {A,B,C,D}=box;
  const midF=[(D[0]+C[0])/2,(D[1]+C[1])/2 - rise];
  const midB=[(A[0]+B[0])/2,(A[1]+B[1])/2 - rise];
  poly(ctx,[D,C,midF],c1); poly(ctx,[A,B,midB],c2);
  poly(ctx,[D,midF,midB,A],c2); poly(ctx,[C,B,midB,midF],c1);
}
function battlements(ctx,gx,gy,gw,gd,h,col){
  for(let i=0;i<gw*2;i++){ const p=isoPt(gx+i*0.5,gy); ctx.fillStyle=col; ctx.fillRect(p[0]-2,p[1]-h-6,5,6); }
}
function frontWindows(ctx,gx,gyFront,gw,n,night){
  for(let i=0;i<n;i++){ const p=isoPt(gx+0.3+i*(gw-0.6)/n, gyFront); litWin(ctx,p[0]-3,p[1]-22,6,8,night); }
}

function shade(hex,d){ const n=parseInt(hex.slice(1),16); const r=Math.max(0,Math.min(255,(n>>16)+d)),g=Math.max(0,Math.min(255,((n>>8)&255)+d)),b=Math.max(0,Math.min(255,(n&255)+d)); return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1); }
// A small front-of-shop kiosk with emoji sign
