function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill(); }

/* ── Pedestrians ─────────────────────────────────────────────────── */
const PED_COL={
  civ:['#8a94a0','#a0897a','#7a8a6a','#9a7a8a'], runner:['#20242c'], enforcer:['#2a2018'],
  police:['#1a2a4a'], gardener:['#2f5033']
};
const ROAD_LINES=[0,3,6,9];
const HOUSE_CX=4, HOUSE_CY=4;   // centre of the house grounds (Crew scene)
function mkPed(type){ return { type, axis:Math.random()<0.5?'h':'v', line:pick(ROAD_LINES),
  t:Math.random(), dir:Math.random()<0.5?1:-1, lane:Math.random()<0.5?-0.22:0.22,
  spd:0.02+Math.random()*0.03, ph:Math.random()*6.28, col:pick(PED_COL[type]||PED_COL.civ),
  ang:Math.random()*6.28, r:2.4+Math.random()*1.6, asp:0.25+Math.random()*0.4,
  cx:HOUSE_CX, cy:HOUSE_CY }; }
function empBuildPeds(mode){
  peds=[];
  if(mode==='garden'){
    // the Grow scene: a gardener or two tending the pots, plus you
    const g=Math.max(1, Math.min(2, countRole('gardener')||1));
    for(let i=0;i<g;i++){ const pd=mkPed('gardener'); pd.path='ring'; pd.cx=3; pd.cy=2.6; pd.r=1.5+Math.random()*0.6; pd.asp=0.2+Math.random()*0.25; peds.push(pd); }
    return;
  }
  if(mode==='house'){
    // the Crew scene: one figure per staff member, milling around the house
    for(const s of S.staff){ const t=({dealer:'runner',enforcer:'enforcer',gardener:'gardener',
      fixer:'civ',botanist:'gardener',guard:'enforcer',barrister:'civ'})[s.role]||'civ';
      const pd=mkPed(t); pd.path='ring'; pd.name=s.name; peds.push(pd); }
    for(let i=0;i<3;i++){ const pd=mkPed('civ'); pd.path='ring'; peds.push(pd); }  // a little life
    return;
  }
  // the Street scene: a whole city population
  const civ = 8 + Math.min(20, Math.floor(S.rep/80) + ownedTurf().reduce((a,d)=>a+d.str,0)*2);
  for(let i=0;i<civ;i++) peds.push(mkPed('civ'));
  for(let i=0;i<Math.min(8,countRole('dealer'));i++) peds.push(mkPed('runner'));
  for(let i=0;i<Math.min(8,countRole('enforcer'));i++) peds.push(mkPed('enforcer'));
  for(let i=0;i<Math.min(4,countRole('gardener'));i++) peds.push(mkPed('gardener'));
  if(S.heat>=40){ const n=1+Math.floor((S.heat-40)/18); for(let i=0;i<n;i++) peds.push(mkPed('police')); }
}
// city peds walk the street grid; house peds orbit the residence
function pedPos(p){
  if(p.path==='ring'){ return isoPt(p.cx+Math.cos(p.ang)*p.r, p.cy+Math.sin(p.ang)*p.r*1.1); }
  const u=0.2+p.t*8.6;
  return p.axis==='h' ? isoPt(u, p.line+p.lane) : isoPt(p.line+p.lane, u);
}
function updatePeds(dt){
  for(const p of peds){
    if(p.path==='ring'){ p.ang += p.dir*p.asp*dt; continue; }
    p.t+=p.dir*p.spd*dt; if(p.t>1){ p.t=1; p.dir=-1; } else if(p.t<0){ p.t=0; p.dir=1; }
  }
}
function drawPed(ctx,p,now){
  const [x,y]=pedPos(p);
  const sc=0.85+0.3*(p.t);                       // nearer street = slightly bigger
  const swing=Math.sin(now*7+p.ph)*2.2;
  const bob=Math.abs(Math.sin(now*7+p.ph))*1.2;
  // soft contact shadow
  softShadow(ctx,x+2,y+1,7*sc,2.6*sc,0.3);
  const top=y-16*sc-bob;
  // legs
  ctx.strokeStyle='#14181c'; ctx.lineWidth=2*sc; ctx.beginPath();
  ctx.moveTo(x,top+9*sc); ctx.lineTo(x-swing*0.5,y); ctx.moveTo(x,top+9*sc); ctx.lineTo(x+swing*0.5,y); ctx.stroke();
  // body
  ctx.fillStyle=p.col; roundRect(ctx,x-3.2*sc,top,6.4*sc,10*sc,2*sc);
  // head
  ctx.fillStyle='#d9b38a'; ctx.beginPath(); ctx.arc(x,top-2*sc,2.8*sc,0,7); ctx.fill();
  // type markers
  if(p.type==='police'){ ctx.fillStyle='#4a6ab0'; ctx.fillRect(x-3.4*sc,top-4.6*sc,6.8*sc,2.2*sc); }
  if(p.type==='runner'){ ctx.fillStyle='#0c0f13'; ctx.beginPath(); ctx.arc(x,top-2*sc,3.1*sc,3.6,6.6); ctx.fill(); } // hood
  if(p.type==='enforcer'){ ctx.fillStyle=p.col; roundRect(ctx,x-4.2*sc,top,8.4*sc,10*sc,2*sc); } // broad
}

/* ── Gang-war effects ────────────────────────────────────────────── */
function pushWar(where){
  // where: 'hq' | 'street' | 'turf' — positioned on the city grid (roads at 0,3,6,9)
  let gx=6, gy=6;
  if(where==='hq'){ gx=4.5; gy=4.5; } else if(where==='turf'){ gx=pick([3,6]); gy=pick([3,6]); }
  else { gx=pick(ROAD_LINES); gy=0.5+Math.random()*8; }
  const [x,y]=isoPt(gx,gy);
  warFx.push({x,y,life:0,max:2.6, fighters:[]});
  warUnseen=true;
  renderHUD();
}
function drawWar(ctx,fx,dt,now){
  fx.life+=dt; const k=fx.life/fx.max; if(k>=1) return false;
  const {x,y}=fx;
  // ground scorch / dust
  ctx.fillStyle=`rgba(30,20,14,${0.3*(1-k)})`; ctx.beginPath(); ctx.ellipse(x,y,26,11,0,0,7); ctx.fill();
  // clashing figures
  for(let i=0;i<4;i++){ const a=i/4*6.28+now*2; const r=10+Math.sin(now*9+i)*4;
    const fx2=x+Math.cos(a)*r, fy2=y-6+Math.sin(a)*r*0.5;
    ctx.fillStyle=i%2?'#2a2018':'#3a1512'; roundRect(ctx,fx2-3,fy2-9,6,10,2);
    ctx.fillStyle='#d9b38a'; ctx.beginPath(); ctx.arc(fx2,fy2-11,2.4,0,7); ctx.fill(); }
  // muzzle flashes
  if(Math.random()<0.5){ const fxx=x+rnd(-18,18), fyy=y-rnd(4,16);
    const g=ctx.createRadialGradient(fxx,fyy,0,fxx,fyy,10); g.addColorStop(0,'rgba(255,230,140,.95)'); g.addColorStop(1,'rgba(255,120,40,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(fxx,fyy,10,0,7); ctx.fill(); }
  // smoke rising
  for(let i=0;i<3;i++){ const sy=y-fx.life*22-i*10; const a=0.25*(1-k);
    ctx.fillStyle=`rgba(120,120,120,${a})`; ctx.beginPath(); ctx.arc(x+Math.sin(now+i)*6,sy,5+i*2,0,7); ctx.fill(); }
  // expanding ring on impact start
  if(k<0.3){ ctx.strokeStyle=`rgba(226,99,95,${1-k/0.3})`; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(x,y,30*(k/0.3),13*(k/0.3),0,0,7); ctx.stroke(); }
  return true;
}

/* ── Scene assembly ──────────────────────────────────────────────── */
// blocks ordered centre-out so your grandest estates sit in the middle
const CITY_BLOCKS=[[1,1],[1,0],[0,1],[2,1],[1,2],[0,0],[2,0],[0,2],[2,2]];
function roadStrip(ctx,vertical,line,col){
  const a=vertical?isoPt(line-0.45,-0.5):isoPt(-0.5,line-0.45);
  const b=vertical?isoPt(line-0.45,9.5):isoPt(9.5,line-0.45);
  const c=vertical?isoPt(line+0.45,9.5):isoPt(9.5,line+0.45);
  const d=vertical?isoPt(line+0.45,-0.5):isoPt(-0.5,line+0.45);
  poly(ctx,[a,b,c,d],col);
}
function drawSky(ctx,night){
  const sky=ctx.createLinearGradient(0,0,0,EMP_H);
  sky.addColorStop(0, mixNight('#3f6ea5','#0a1226',night));
  sky.addColorStop(0.5, mixNight('#7fa8cf','#101a30',night));
  sky.addColorStop(1, mixNight('#2c3a2a','#0a130d',night));
  ctx.fillStyle=sky; ctx.fillRect(0,0,EMP_W,EMP_H);
  if(night>0.4){ ctx.fillStyle=`rgba(240,236,214,${(night-0.4)*1.2})`;
    for(let i=0;i<30;i++){ const sx=(i*97)%EMP_W, sy=(i*53)%100; ctx.fillRect(sx,sy,1.5,1.5); } }
}
// ── GROW scene: an underground grow room (a garden in a basement) ──
function drawGardenPot(ctx,gx,gy,plot){
  const p=isoPt(gx,gy);
  // contact shadow + pot with a rounded gradient body
  softShadow(ctx,p[0],p[1]+3,12,5,0.28);
  vgrad(ctx,[[p[0]-8,p[1]-6],[p[0]+8,p[1]-6],[p[0]+6,p[1]+4],[p[0]-6,p[1]+4]],'#6a4630','#3e2716');
  poly(ctx,[[p[0]-8,p[1]-7],[p[0]+8,p[1]-7],[p[0]+6,p[1]-5],[p[0]-6,p[1]-5]],'#7a5238'); // rim
  poly(ctx,[[p[0]-6,p[1]-6],[p[0]+6,p[1]-6],[p[0]+5,p[1]-8],[p[0]-5,p[1]-8]],'#1f140c'); // soil
  if(plot && plot.strain){
    const st=strain(plot.strain);
    const pct=Math.min(1, plot.grown/st.grow), ready=plot.grown>=st.grow;
    const dry=plot.water<=0 && !ready;
    const h=7+26*pct;
    ctx.strokeStyle=dry?'#7a5c30':'#3f9c62'; ctx.lineWidth=2.2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(p[0],p[1]-7); ctx.lineTo(p[0],p[1]-7-h); ctx.stroke();
    const pairs=Math.max(1,Math.ceil((ready?1:Math.max(pct,0.18))*3));
    for(let i=1;i<=pairs;i++){ const ly=p[1]-7-h*(i/(pairs+0.5)), lw=7-i*1.1;
      leafBlade(ctx,p[0]-lw*0.8,ly,lw,-0.4,dry);
      leafBlade(ctx,p[0]+lw*0.8,ly,lw,0.4,dry); }
    if(ready){ softGlow(ctx,p[0],p[1]-9-h,16,'rgba(190,230,120,0.5)');
      ctx.fillStyle='#cfe07a'; ctx.beginPath(); ctx.arc(p[0],p[1]-9-h,3.4,0,7); ctx.fill();
      ctx.font='9px sans-serif'; ctx.textAlign='center'; ctx.fillText('✨',p[0]+8,p[1]-10-h); ctx.textAlign='left'; }
  }
}
// a single leaf with a light-to-dark gradient and a midrib
function leafBlade(ctx,x,y,lw,rot,dry){
  const c0=dry?'#b39a5a':'#7fd89a', c1=dry?'#7a5c30':'#3f9c62';
  const g=ctx.createLinearGradient(x-lw,y,x+lw,y); g.addColorStop(0,c1); g.addColorStop(0.5,c0); g.addColorStop(1,c1);
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.fillStyle=g;
  ctx.beginPath(); ctx.ellipse(0,0,lw,2.5,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(20,60,35,.5)'; ctx.lineWidth=0.6; ctx.beginPath(); ctx.moveTo(-lw,0); ctx.lineTo(lw,0); ctx.stroke();
  ctx.restore();
}
function drawGrowLight(ctx,gx,gy,ceil){
  const p=isoPt(gx,gy), ly=p[1]-ceil;
  ctx.strokeStyle='#2a2f36'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(p[0]-6,ly-13); ctx.lineTo(p[0]-6,ly); ctx.moveTo(p[0]+6,ly-13); ctx.lineTo(p[0]+6,ly); ctx.stroke();
  // magenta grow-light cone to the floor
  const g=ctx.createLinearGradient(p[0],ly,p[0],p[1]);
  g.addColorStop(0,'rgba(214,120,255,0.30)'); g.addColorStop(1,'rgba(214,120,255,0)');
  ctx.fillStyle=g; poly(ctx,[[p[0]-11,ly+2],[p[0]+11,ly+2],[p[0]+20,p[1]],[p[0]-20,p[1]]]);
  // fixture + bright tube with bloom
  ctx.fillStyle='#1a1e24'; roundRect(ctx,p[0]-13,ly-5,26,6,1);
  softGlow(ctx,p[0],ly,20,'rgba(236,190,255,0.55)');
  ctx.fillStyle='rgba(244,214,255,0.98)'; ctx.fillRect(p[0]-11,ly-1,22,2.5);
}
function empDrawGarden(ctx,now){
  // no sky — it's a cellar
  ctx.fillStyle='#0a0d0b'; ctx.fillRect(0,0,EMP_W,EMP_H);
  const H=70;
  const A=isoPt(-0.4,-0.4),B=isoPt(6.4,-0.4),C=isoPt(6.4,5.4),D=isoPt(-0.4,5.4);
  // floor
  poly(ctx,[A,B,C,D],'#211d18');
  ctx.strokeStyle='rgba(255,255,255,0.03)'; ctx.lineWidth=1;
  for(let i=0;i<=6;i++){ const a=isoPt(i,-0.4),b=isoPt(i,5.4); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); }
  for(let j=0;j<=5;j++){ const a=isoPt(-0.4,j),b=isoPt(6.4,j); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); }
  // back walls (brick)
  poly(ctx,[A,B,[B[0],B[1]-H],[A[0],A[1]-H]],'#241f1a');
  poly(ctx,[A,D,[D[0],D[1]-H],[A[0],A[1]-H]],'#1d1914');
  ctx.strokeStyle='rgba(0,0,0,0.28)'; ctx.lineWidth=1;
  for(let k=1;k<5;k++){ // brick courses on right wall
    const y=-k*(H/5); ctx.beginPath(); ctx.moveTo(A[0],A[1]+y); ctx.lineTo(B[0],B[1]+y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(A[0],A[1]+y); ctx.lineTo(D[0],D[1]+y); ctx.stroke(); }
  // ducting + a small barrel along the back
  ctx.fillStyle='#33383f'; roundRect(ctx,A[0]-2,A[1]-H+6,120,7,3);
  const bar=isoPt(0.5,0.5); ctx.fillStyle='#2b3a4a'; roundRect(ctx,bar[0]-8,bar[1]-24,16,20,3); ctx.fillStyle='#3a4c5e'; ctx.fillRect(bar[0]-8,bar[1]-20,16,3);

  // collect drawables (lights behind pots), sorted by depth
  const items=[];
  const push=(gx,gy,fn)=>items.push({y:isoPt(gx,gy)[1], fn});
  // gather this empire's plots to fill the pots
  const plots=[];
  for(const id in S.estates){ const est=S.estates[id]; if(!est.owned) continue; for(const p of est.plots) plots.push(p); }
  const cols=4, rows=3; let idx=0;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const gx=0.9+c*1.35, gy=1.0+r*1.35;
    push(gx,gy-0.4, ((gx,gy)=>()=>drawGrowLight(ctx,gx,gy,H-6))(gx,gy));   // light above
    const plot=plots[idx++];
    push(gx,gy, ((gx,gy,plot)=>()=>drawGardenPot(ctx,gx,gy,plot))(gx,gy,plot));
  }
  // gardener(s)
  for(const p of peds){ const pp=pedPos(p); items.push({y:pp[1], fn:()=>drawPed(ctx,p,now)}); }
  items.sort((a,b)=>a.y-b.y); for(const it of items) it.fn();

  // faint grow-light haze over everything
  ctx.fillStyle='rgba(150,70,180,0.06)'; ctx.fillRect(0,0,EMP_W,EMP_H);
  let growing=0, total=0; for(const p of plots){ total++; if(p.strain) growing++; }
  postFX(ctx);
  ctx.fillStyle='rgba(240,236,214,.8)'; ctx.font='12px Georgia, serif'; ctx.textAlign='left';
  ctx.fillText('The Cellar Grow', 12, EMP_H-12);
  ctx.textAlign='right'; ctx.fillText(`${growing}/${total} plots growing`, EMP_W-12, EMP_H-12);
  ctx.textAlign='left';
}
// ── CREW scene: your residence on its grounds, staff milling about ──
function empDrawHouse(ctx,now){
  const night=nightFactor(S.min/60);
  drawSky(ctx,night);
  // lawn platform
  poly(ctx,[isoPt(0.5,0.5),isoPt(8.5,0.5),isoPt(8.5,8.5),isoPt(0.5,8.5)], mixNight('#1f4228','#0e2015',night));
  // a circular drive around the house
  ctx.strokeStyle=mixNight('#2a2b2e','#14161a',night); ctx.lineWidth=10;
  ctx.beginPath();
  for(let a=0;a<=6.3;a+=0.2){ const p=isoPt(HOUSE_CX+Math.cos(a)*2.9, HOUSE_CY+Math.sin(a)*2.9*1.1); if(a===0)ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); }
  ctx.closePath(); ctx.stroke();
  const items=[];
  const push=(gx,gy,fn)=>items.push({y:isoPt(gx,gy)[1], fn});
  // the residence (grandest estate), flag flying — scaled up for presence
  const tier=heroEstateIdx(); const bx=HOUSE_CX-0.75, by=HOUSE_CY-0.65;
  const base=isoPt(HOUSE_CX,HOUSE_CY);
  push(bx+1.5,by+1.3, ()=>{ ctx.save(); ctx.translate(base[0],base[1]); ctx.scale(1.5,1.5); ctx.translate(-base[0],-base[1]);
    drawBuilding(ctx,tier,bx,by,night,true); ctx.restore(); });
  // grounds dressing
  [[1.4,1.4],[7.2,1.4],[1.4,7.2],[7.2,7.2]].forEach(([gx,gy])=> push(gx,gy,()=>drawTree(ctx,gx,gy)));
  [[HOUSE_CX,1.2],[HOUSE_CX,7.2],[1.4,HOUSE_CY],[7.2,HOUSE_CY]].forEach(([gx,gy])=> push(gx,gy,()=>drawLamp(ctx,gx,gy,night)));
  if(lux('motor')) push(HOUSE_CX+0.2,HOUSE_CY+2.6,()=>drawCar(ctx,HOUSE_CX+0.2,HOUSE_CY+2.6));
  // crew figures orbit the house
  for(const p of peds){ const pp=pedPos(p); items.push({y:pp[1], fn:()=>drawPed(ctx,p,now)}); }
  items.sort((a,b)=>a.y-b.y); for(const it of items) it.fn();
  if(night>0.3){ ctx.fillStyle=`rgba(6,10,20,${night*0.34})`; ctx.fillRect(0,0,EMP_W,EMP_H); }
  const nCrew=S.staff.length;
  postFX(ctx);
  ctx.fillStyle='rgba(240,236,214,.78)'; ctx.font='12px Georgia, serif'; ctx.textAlign='left';
  ctx.fillText(`${ESTATES[tier].name} · your residence`, 12, EMP_H-12);
  ctx.textAlign='right'; ctx.fillText(`${nCrew} on the payroll · ${phaseStr()}`, EMP_W-12, EMP_H-12);
  ctx.textAlign='left';
}
// ── STREET scene: the whole city ──
function empDrawCity(ctx,now){
  const night=nightFactor(S.min/60);
  drawSky(ctx,night);
  // ground
  poly(ctx,[isoPt(-0.5,-0.5),isoPt(9.5,-0.5),isoPt(9.5,9.5),isoPt(-0.5,9.5)], mixNight('#1c3a24','#0d1c13',night));
  // roads (grid of avenues)
  const rc=mixNight('#2a2b2e','#14161a',night);
  ROAD_LINES.forEach(L=>{ roadStrip(ctx,false,L,rc); roadStrip(ctx,true,L,rc); });
  // centre dashes on the two main avenues
  ctx.strokeStyle=`rgba(217,180,91,${night>0.4?0.4:0.6})`; ctx.lineWidth=1.4; ctx.setLineDash([7,9]);
  [3,6].forEach(L=>{ let a=isoPt(-0.5,L),b=isoPt(9.5,L); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    a=isoPt(L,-0.5); b=isoPt(L,9.5); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); });
  ctx.setLineDash([]);

  // collect every drawable with a depth (front-base screen-y), then paint back→front
  const items=[];
  const push=(gx,gy,fn)=>items.push({y:isoPt(gx,gy)[1], fn});
  // estates (grandest centre) + generic filler = a whole city
  const owned=[]; ESTATES.forEach((e,i)=>{ if(S.estates[e.id]?.owned) owned.push(i); }); owned.sort((a,b)=>b-a);
  CITY_BLOCKS.forEach((blk,bi)=>{ const bx=blk[0]*3+1.15, by=blk[1]*3+1.15;
    if(bi<owned.length){ const tier=owned[bi], isHome=(bi===0);
      push(bx+1.5,by+1.3, ()=>drawBuilding(ctx,tier,bx,by,night,isHome)); }
    else { const seed=blk[0]*7+blk[1]*3+3; push(bx+1.4,by+1.2, ()=>drawGeneric(ctx,seed,bx,by,night)); }
  });
  // front-business shops as a market row on the front avenue
  FRONTS.filter(f=>S.fronts[f.id]).forEach((f,i)=>{ const gx=0.6+i*1.25, gy=8.9;
    push(gx+0.8,gy+0.7, ()=>drawShop(ctx,f,gx,gy,i,night)); });
  // props
  [[0.2,3],[3,0.2],[6,0.2],[9.2,6]].forEach(([gx,gy],i)=> push(gx,gy,()=>drawTree(ctx,gx,gy)));
  [[3,3],[6,3],[3,6],[6,6]].forEach(([gx,gy])=> push(gx,gy,()=>drawLamp(ctx,gx,gy,night)));
  if(lux('motor')) push(3,4.5,()=>drawCar(ctx,3,4.5));
  if(lux('boat'))  push(9.3,9.3,()=>drawBoat(ctx,9.3,9.3));
  // turf banners at inner intersections — green for each district you hold
  [[3,3],[6,3],[3,6],[6,6],[9,9]].forEach(([gx,gy],i)=> push(gx+0.05,gy+0.05,()=>drawTurfFlag(ctx,gx,gy,i<ownedTurf().length)));
  // pedestrians
  for(const p of peds){ const pp=pedPos(p); items.push({y:pp[1], fn:()=>drawPed(ctx,p,now)}); }
  // paint
  items.sort((a,b)=>a.y-b.y);
  for(const it of items) it.fn();

  // war effects above everything
  warFx = warFx.filter(fx=>drawWar(ctx,fx,empDT,now));
  // night vignette + cinematic vignette
  if(night>0.3){ ctx.fillStyle=`rgba(6,10,20,${night*0.34})`; ctx.fillRect(0,0,EMP_W,EMP_H); }
  postFX(ctx);
  // caption
  const nEst=owned.length;
  ctx.fillStyle='rgba(240,236,214,.75)'; ctx.font='12px Georgia, serif'; ctx.textAlign='left';
  ctx.fillText(`Your City · ${nEst} estate${nEst!==1?'s':''} · ${phaseStr()}`, 12, EMP_H-12);
  ctx.textAlign='right'; ctx.fillText(`${ownedTurf().length}/${DISTRICTS.length} districts · ${peds.length} on the streets`, EMP_W-12, EMP_H-12);
  ctx.textAlign='left';
}
function mixNight(day, night,f){ return hexLerp(day,night,f); }
// gentle cinematic vignette to seat the scene
function postFX(ctx){
  const g=ctx.createRadialGradient(EMP_W/2,EMP_H*0.44,EMP_H*0.34,EMP_W/2,EMP_H*0.5,EMP_W*0.72);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.36)');
  ctx.fillStyle=g; ctx.fillRect(0,0,EMP_W,EMP_H);
}

let empDT=0.016, sceneMode=null;
// mode: 'city' (Street tab) or 'house' (Crew tab)
function sceneStart(mode){
  const cv=$('sceneCanvas'); if(!cv) return;
  // Size the backing store to the real displayed size × pixel density, then scale the
  // logical 720-wide coordinate space to fit — crisp on both phones and desktop.
  const cssW=(cv.getBoundingClientRect().width)||EMP_W;
  const dpr=Math.max(1, Math.min(2.5, window.devicePixelRatio||1));
  const bw=Math.round(cssW*dpr), bh=Math.round(cssW*(EMP_H/EMP_W)*dpr);
  if(cv.width!==bw){ cv.width=bw; cv.height=bh; }
  const ctx=cv.getContext('2d');
  const s=cv.width/EMP_W; ctx.setTransform(s,0,0,s,0,0);
  ctx.lineJoin='round';
  sceneMode=mode;
  empBuildPeds(mode);
  if(mode==='city'){ const hadWar=warUnseen; warUnseen=false;
    if(hadWar){ const [x,y]=isoPt(6,6); warFx.push({x,y,life:0,max:3.4}); } }
  const DRAW={garden:empDrawGarden, house:empDrawHouse, city:empDrawCity};
  let last=performance.now();
  sceneStop();
  (function loop(now){
    empDT=Math.min(0.05,(now-last)/1000); last=now;
    updatePeds(empDT);
    (DRAW[sceneMode]||empDrawCity)(ctx, now/1000);
    empRAF=requestAnimationFrame(loop);
  })(performance.now());
}
function sceneStop(){ if(empRAF){ cancelAnimationFrame(empRAF); empRAF=null; } }

/* ── Rendering ───────────────────────────────────────────────────── */
function renderHUD(){
  $('clock').textContent=clockStr();
  $('hCash').textContent=fmt(S.cash);
  $('hBank').textContent=fmt(S.bank);
  $('hRep').textContent=S.rep;
  $('hHeat').textContent=Math.round(S.heat);
  $('heatfill').style.width=S.heat+'%';
  $('heatwrap').classList.toggle('hot', S.heat>=70);
  const b=$('bdgOffers');
  const n=S.offers.length+S.contracts.length;
  if(n){ b.textContent=n; b.classList.remove('hidden'); }
  else b.classList.add('hidden');
  const bl=$('bdgLife');
  const datable=PEOPLE.some(p=>aff(p.id)>0 && aff(p.id)<100) && S.dateDoneDay!==S.day;
  if(datable){ bl.textContent='♥'; bl.classList.remove('hidden'); } else bl.classList.add('hidden');
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));
  const tb=$('tab-'+S.tab); if(tb) tb.classList.add('on');
  document.querySelectorAll('#speed button').forEach(x=>x.classList.remove('on'));
  const sp=$('sp'+S.speed); if(sp) sp.classList.add('on');
  const mb=$('muteBtn'); if(mb) mb.textContent=S.muted?'🔇':'🔊';
  updateScene();
}

const SCENE_TABS={grow:'garden', street:'city', crew:'house'};
let lastTab=null, lastHTML='', animT=null;
function manageScene(){
  const titleUp = $('title') && $('title').style.display!=='none';
  const want = (modalOpen||titleUp) ? null : (SCENE_TABS[S.tab]||null);
  const stage=$('cityStage'), strip=$('scenewrap');
  if(want){
    if(stage) stage.classList.remove('hidden');
    if(strip) strip.classList.add('hidden');          // hide the small strip; the big stage is showing
    if(!empRAF || sceneMode!==want) sceneStart(want);  // (re)start when entering or switching scene
  } else {
    if(stage) stage.classList.add('hidden');
    if(strip) strip.classList.remove('hidden');
    if(empRAF) sceneStop();
  }
}
function render(){
  renderHUD();
  if(modalOpen){ manageScene(); return; }
  const v=$('view');
  const html=({grow:rGrow, street:rStreet, crew:rCrew, biz:rBiz, life:rLife, ledger:rLedger}[S.tab]||rGrow)();
  const switched = S.tab!==lastTab;
  // Only touch the DOM when the markup actually changed — avoids rewriting
  // identical innerHTML every tick, which restarted CSS animations and flickered.
  if(html!==lastHTML || switched){
    lastHTML=html;
    v.innerHTML=html;
  }
  // Card entrance animation plays once per tab switch, then the class is
  // stripped so per-tick re-renders don't re-trigger it (that was the flashing).
  if(switched){
    lastTab=S.tab;
    v.classList.remove('anim'); void v.offsetWidth; v.classList.add('anim');
    clearTimeout(animT); animT=setTimeout(()=>v.classList.remove('anim'), 360);
  }
  manageScene();
}

function plotCell(eid,p,i){
  if(!p.strain) return `<div class="plot" onclick="A.plot('${eid}',${i})"><span class="plus">➕</span><span class="nm">Plant</span></div>`;
  const st=strain(p.strain);
  const pct=Math.min(100,Math.round(p.grown/st.grow*100));
  const ready=p.grown>=st.grow;
  return `<div class="plot ${ready?'ready':''} ${(!ready&&p.water<=0)?'dry':''}" onclick="A.plot('${eid}',${i})">
    ${plantSVG(pct, !ready&&p.water<=0, ready)}
    <span class="nm">${ready?'✨ HARVEST':st.name}</span>
    ${ready?'':`<span class="bar"><i style="width:${pct}%"></i></span>
    <span class="bar w"><i style="width:${Math.round(p.water)}%"></i></span>
    <span class="nm">${(!ready&&p.water<=0)?'💀 needs water!':pct+'%'}</span>`}
  </div>`;
}

function rStreet(){
  let h='<div class="card"><h3>📦 Inventory & Market</h3><div class="sub">Prices shift every dawn. Sell into a hot market.</div>';
  const keys=Object.keys(S.inv).filter(k=>S.inv[k]>0);
  h+= keys.length ? keys.map(k=>{const st=strain(k); const m=mkt(k);
      const arrow=m>=1.12?'<span class="up">▲ hot</span>':m<=0.88?'<span class="down">▼ cold</span>':'<span class="muted">◆ steady</span>';
      return `<div class="invrow">${st.em} <b>${st.name}</b><span class="spacer"></span>
        <span>${S.inv[k]} units</span><span class="muted">~${fmt(st.value*m)}/ea</span>${arrow}</div>`;}).join('')
    : '<div class="sub" style="margin-top:6px">Empty. Harvest something — buyers don\'t wait for excuses.</div>';
  h+='</div>';

  if(S.contracts.length){
    h+='<div class="card"><h3>📜 Contracts</h3><div class="sub">Bulk orders, paid in clean bank money. Miss the deadline and your name suffers.</div></div>';
    for(const c of S.contracts){
      const st=strain(c.strain);
      const pay=Math.round(c.qty*st.value*c.mult);
      const daysLeft=c.deadline-S.day;
      const have=S.inv[c.strain]||0;
      h+=`<div class="card contract"><div class="rowline">
        <b>${st.em} ${c.qty}× ${st.name}</b><span class="spacer"></span>
        <span class="price money">${fmt(pay)}</span></div>
        <div class="sub">Pays to <b class="money">bank</b> at ${Math.round(c.mult*100)}% value · ${daysLeft} day${daysLeft!==1?'s':''} left · you have ${have}/${c.qty}</div>
        <div class="offbtns"><button class="gold" onclick="A.deliver(${c.id})" ${have<c.qty?'disabled':''}>Deliver</button></div></div>`;
    }
  }

  h+='<div class="card"><h3>🤝 Street Offers</h3><div class="sub">Buyers appear 09:00–02:00. Haggle once per buyer. Every deal adds heat.</div></div>';
  if(!S.offers.length) h+='<div class="card"><div class="sub" style="text-align:center">The street is quiet… for now.</div></div>';
  for(const o of S.offers){
    const st=strain(o.strain);
    const have=S.inv[o.strain]||0;
    const q=Math.min(o.qty,have);
    const mins=Math.max(0,o.expires-abs());
    h+=`<div class="card offer"><div class="rowline">
      <b>${st.em} ${o.qty}× ${st.name}</b><span class="spacer"></span>
      <span class="price money">${fmt(o.price)}/ea</span></div>
      <div class="sub">Total ${fmt(o.price*q)} for your ${q} · +${o.heat} heat · leaves in ${mins} min ${have<o.qty?`· <span class="bad">you only have ${have}</span>`:''}</div>
      <div class="offbtns">
        <button class="gold" onclick="A.accept(${o.id})" ${q<=0?'disabled':''}>Sell ${q}</button>
        <button onclick="A.haggle(${o.id})" ${o.haggled?'disabled':''}>Haggle</button>
        <button class="ghost" onclick="A.decline(${o.id})">Decline</button>
      </div></div>`;
  }
  const d=countRole('dealer');
  h+=`<div class="card"><h3>🕶️ Runners</h3><div class="sub">${d?`${d} runner${d>1?'s':''} moving product automatically at ${up('cellar')?90:80}% value (10:00–22:00).`:'No runners. Hire some in Crew to sell while you sleep.'}</div></div>`;

  const enf=countRole('enforcer');
  h+=`<div class="card"><h3>🗺️ Turf</h3><div class="sub">Five districts, five crews. Take corners with <b>Enforcers</b> (hire in Crew) — held turf pays street cash every dawn, but rivals will try to take it back and every corner adds heat scaled to its size. You have <b>${enf}</b> enforcer${enf!==1?'s':''}.</div></div>`;
  for(const dd of DISTRICTS){
    const own=S.turf[dd.id];
    const weak=!!S.hits[dd.id];
    const need=weak?Math.max(1,dd.str-1):dd.str;
    const cost=weak?Math.round(dd.str*1000*0.5):dd.str*1000;
    const odds=Math.round(Math.min(0.95, 0.5+0.15*(enf-need)+(weak?0.25:0))*100);
    h+=`<div class="card" style="border-left:3px solid ${own?'var(--green)':'#7a3a38'}">
      <div class="rowline"><h3>${own?'🟢':'🔴'} ${dd.name}</h3><span class="spacer"></span>
      <span class="pill">💷 ${fmt(dd.income)}/day</span><span class="pill">💪 strength ${dd.str}</span>${weak?'<span class="pill" style="color:var(--red)">🎯 weakened</span>':''}</div>
      <div class="sub">${dd.blurb}<br>${own
        ? `<b class="money">Yours.</b> ${dd.crew} want it back — keep ${dd.str}+ enforcers on the books.`
        : `Run by <b>${dd.crew}</b>. A move needs <b>${need} enforcer${need>1?'s':''}</b> + <b class="dirty">${fmt(cost)}</b> cash.`}</div>
      ${own?'':`<div class="offbtns">
        <button class="gold" onclick="A.takeover('${dd.id}')" ${enf<need||S.cash<cost?'disabled':''}>Move on it${enf>=need?` · ${odds}% odds`:''}</button>
        ${weak?'':`<button class="danger" onclick="A.orderHit('${dd.id}')" ${S.cash<dd.str*3000?'disabled':''}>🎯 Order a hit</button>`}
      </div>`}
    </div>`;
  }
  return h;
}

    <div class="choices"><button class="gold" onclick="A.close()">Begin</button></div>`);
}

/* ── Main loop ───────────────────────────────────────────────────── */
const SPEEDS={0:0,1:1,2:2,3:4};
function tick(){
  if(!S || S.won){ if(S) renderHUD(); return; }
  if(modalOpen) return;
  const t=$('title'); if(t && t.style.display!=='none') return;
  const rate=SPEEDS[S.speed]||0;
  if(rate===0){ renderHUD(); return; }
  S.minF += rate*0.25;
  while(S.min < Math.floor(S.minF)){
    S.min++; S.absMin++;
    if(S.min>=1440){ S.min=0; S.minF-=1440; }
    minutePlants();
    minuteOffers();
    minuteDealers();
    if(S.min===360) settle();
    if(S.eventMin!==null && S.min===S.eventMin && S.eventDoneDay!==S.day){
      S.eventDoneDay=S.day; fireEvent();
      break;
    }
  }
  render();
}

/* ── Save / load ─────────────────────────────────────────────────── */
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const s=JSON.parse(raw);
    if(!s || s.v<1 || s.v>4) return null;
    // migrate older saves forward
    if(s.absMin===undefined) s.absMin=(s.day-1)*1440+s.min;
    if(!s.contracts) s.contracts=[];
    if(!s.nextContractId) s.nextContractId=1;
    if(!s.ach) s.ach={};
    if(!s.market) s.market={};
    if(!s.seeds) s.seeds={};
    if(!s.turf) s.turf={};
    if(!s.luxury) s.luxury={};
    if(!s.community) s.community={};
    if(!s.people) s.people={};
    if(s.trust===undefined) s.trust=0;
    if(s.dateDoneDay===undefined) s.dateDoneDay=0;
    if(s.married===undefined) s.married=null;
    if(!s.family) s.family=[];
    if(!s.hits) s.hits={};
    if(s.muted===undefined) s.muted=false;
    if(s.stats){ ['contracts','turf','hits','dates'].forEach(k=>{ if(s.stats[k]===undefined) s.stats[k]=0; }); }
    s.v=4;
    return s;
  }catch(e){}
  return null;
}

/* ── Boot ────────────────────────────────────────────────────────── */
const hadSave = !!localStorage.getItem(SAVE_KEY);
S = load() || freshState();
if(!Object.keys(S.market).length) rollMarket();
if(!hadSave){ $('tContinue').style.display='none'; }
if($('muteBtn')) $('muteBtn').textContent=S.muted?'🔇':'🔊';
render();  // render behind the title so it's ready
setInterval(tick, 250);
setInterval(save, 15000);
window.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ save(); sceneStop(); }
  else if(S && SCENE_TABS[S.tab] && $('title').style.display==='none' && !modalOpen){ sceneStart(SCENE_TABS[S.tab]); }
});
// first user gesture unlocks audio on mobile
document.addEventListener('pointerdown', audioInit, {once:true});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', {scope:'./'}).catch(()=>{});
}
</script>
